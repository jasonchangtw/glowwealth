<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowWealth - 私人投資追蹤</title>
    <!-- 引入 CSS 與核心套件 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fadeIn { animation: fadeIn 0.5s ease-in; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 智慧名稱字典
        const STOCK_NAMES = {
          '2330': '台積電', '2317': '鴻海', 'AAPL': '蘋果', 'NVDA': '輝達', 'VOO': 'S&P 500 ETF'
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [transactions, setTransactions] = useState([]);

            return (
                <div className="min-h-screen p-4 md:p-8 animate-fadeIn">
                    <header className="mb-8 flex justify-between items-center bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-2xl">
                        <div>
                            <h1 className="text-2xl font-bold bg-gradient-to-r from-teal-400 to-emerald-400 bg-clip-text text-transparent">
                                GlowWealth 投資管家
                            </h1>
                            <p className="text-xs text-slate-500 mt-1">GitHub Pages 雲端部署版</p>
                        </div>
                        <div className="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-400">
                            已連線至本機存儲
                        </div>
                    </header>

                    <nav className="grid grid-cols-3 gap-3 mb-8">
                        {['dashboard', 'ledger', 'drive'].map(tab => (
                            <button 
                                key={tab}
                                onClick={() => setActiveTab(tab)}
                                className={`py-3 rounded-xl border transition-all ${
                                    activeTab === tab 
                                    ? 'bg-teal-500/10 border-teal-500 text-teal-400 shadow-[0_0_15px_rgba(20,184,166,0.2)]' 
                                    : 'bg-slate-900 border-slate-800 text-slate-500 hover:border-slate-700'
                                }`}
                            >
                                {tab === 'dashboard' ? '📊 儀表板' : tab === 'ledger' ? '📖 記帳本' : '☁️ 雲端同步'}
                            </button>
                        ))}
                    </nav>

                    <main className="bg-slate-900 border border-slate-800 rounded-2xl p-6 min-h-[300px] shadow-xl">
                        {activeTab === 'dashboard' && (
                            <div className="text-center py-12">
                                <div className="text-5xl mb-4">📈</div>
                                <h2 className="text-xl font-bold mb-2">歡迎使用您的資產帳簿</h2>
                                <p className="text-slate-500 text-sm">點擊「記帳本」開始記錄您的第一筆投資。</p>
                            </div>
                        )}

                        {activeTab === 'ledger' && (
                            <div>
                                <h3 className="font-bold mb-4 flex justify-between items-center">
                                    <span>交易紀錄</span>
                                    <button className="text-xs bg-teal-500 text-slate-950 px-3 py-1 rounded-lg font-bold">新增交易</button>
                                </h3>
                                <div className="bg-slate-950/50 rounded-xl p-8 text-center text-slate-600 text-sm border border-slate-800/50">
                                    目前尚無交易明細
                                </div>
                            </div>
                        )}

                        {activeTab === 'drive' && (
                            <div className="max-w-md mx-auto space-y-6 py-4">
                                <div className="bg-sky-500/10 border border-sky-500/20 p-4 rounded-xl text-sky-400 text-xs">
                                    <strong>💡 跨設備同步：</strong><br/>
                                    請在此輸入 Google Client ID，即可將資料同步至您的個人雲端硬碟。
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="貼上 Client ID..." 
                                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sky-500"
                                />
                                <button className="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded-xl transition">
                                    授權登入 Google Drive
                                </button>
                            </div>
                        )}
                    </main>

                    <footer className="mt-12 text-center text-[10px] text-slate-600 uppercase tracking-widest">
                        Your Privacy, Your Drive. No Database Required.
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
