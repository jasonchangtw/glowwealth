<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowWealth - 旗艦完整同步版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const STOCK_NAMES = {
          '2330': '台積電', '2317': '鴻海', '2454': '聯發科', '2382': '廣達', '3231': '緯創',
          '0050': '元大台灣50', '0056': '元大高股息', '00878': '國泰永續高股息', '00919': '群益台灣精選高息',
          'AAPL': '蘋果公司', 'TSLA': '特斯拉', 'NVDA': '輝達', 'MSFT': '微軟', 'AMZN': '亞馬遜',
          'VOO': 'S&P 500 ETF', 'QQQ': '納斯達克100 ETF', 'VT': '全球整體股市 ETF'
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [currency, setCurrency] = useState('TWD');
            const [exchangeRate, setExchangeRate] = useState(32.5);
            
            // 資料狀態
            const [transactions, setTransactions] = useState(() => {
                const local = localStorage.getItem('gw_txs');
                return local ? JSON.parse(local) : [];
            });

            // Google Drive 狀態
            const [gdriveClientId, setGdriveClientId] = useState(() => localStorage.getItem('gw_client_id') || '');
            const [gdriveToken, setGdriveToken] = useState(null);
            const [gdriveUser, setGdriveUser] = useState(null);
            
            // 表單狀態
            const [form, setForm] = useState({ market: 'TW', symbol: '', name: '', price: '', shares: '' });

            useEffect(() => { localStorage.setItem('gw_txs', JSON.stringify(transactions)); }, [transactions]);

            // ==================== Dashboard 統計大腦 ====================
            const stats = useMemo(() => {
                let totalCostTwd = 0;
                let totalValueTwd = 0;

                // 這裡簡化處理：假設現價 = 買入價 (真實環境需串接 API，此處先顯示基本統計)
                transactions.forEach(tx => {
                    const cost = parseFloat(tx.price) * parseFloat(tx.shares);
                    const costTwd = tx.market === 'TW' ? cost : cost * exchangeRate;
                    totalCostTwd += costTwd;
                    totalValueTwd += costTwd; // 預設現值等於成本
                });

                return {
                    totalCostTwd,
                    totalCostUsd: totalCostTwd / exchangeRate,
                    count: transactions.length
                };
            }, [transactions, exchangeRate]);

            const handleAddTx = (e) => {
                e.preventDefault();
                if (!form.symbol || !form.price || !form.shares) return alert('請填寫完整！');
                const newTx = { ...form, id: Date.now().toString(), date: new Date().toLocaleDateString() };
                setTransactions([newTx, ...transactions]);
                setForm({ market: 'TW', symbol: '', name: '', price: '', shares: '' });
            };

            const handleGoogleLogin = () => {
                if (!gdriveClientId) return alert('請先輸入 Client ID');
                localStorage.setItem('gw_client_id', gdriveClientId);
                const client = window.google.accounts.oauth2.initTokenClient({
                    client_id: gdriveClientId,
                    scope: 'https://www.googleapis.com/auth/drive.file',
                    ux_mode: 'popup',
                    callback: (res) => {
                        setGdriveToken(res.access_token);
                        fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: `Bearer ${res.access_token}` }})
                        .then(r => r.json()).then(u => setGdriveUser(u));
                    }
                });
                client.requestAccessToken();
            };

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-5xl mx-auto space-y-6">
                    <header className="flex justify-between items-center bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-2xl">
                        <div>
                            <h1 className="text-2xl font-bold bg-gradient-to-r from-teal-400 to-emerald-400 bg-clip-text text-transparent">GlowWealth</h1>
                            <p className="text-xs text-slate-500 mt-1">旗艦雲端同步版</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setCurrency('TWD')} className={`px-3 py-1 rounded-lg text-xs font-bold ${currency === 'TWD' ? 'bg-teal-500 text-slate-900' : 'bg-slate-800'}`}>TWD</button>
                            <button onClick={() => setCurrency('USD')} className={`px-3 py-1 rounded-lg text-xs font-bold ${currency === 'USD' ? 'bg-teal-500 text-slate-900' : 'bg-slate-800'}`}>USD</button>
                        </div>
                    </header>

                    {/* 📊 重新上線的 Dashboard 功能區 */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                            <div className="text-xs text-slate-500">投資總成本 ({currency})</div>
                            <div className="text-2xl font-bold mt-1 text-slate-100">
                                {currency === 'TWD' ? `NT$ ${Math.round(stats.totalCostTwd).toLocaleString()}` : `$ ${stats.totalCostUsd.toLocaleString(undefined, {maximumFractionDigits: 0})}`}
                            </div>
                        </div>
                        <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                            <div className="text-xs text-slate-500">持股標的數</div>
                            <div className="text-2xl font-bold mt-1 text-teal-400">{stats.count} <span className="text-sm">檔</span></div>
                        </div>
                        <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                            <div className="text-xs text-slate-500">雲端狀態</div>
                            <div className={`text-sm font-bold mt-2 ${gdriveUser ? 'text-emerald-400' : 'text-rose-400'}`}>
                                {gdriveUser ? `🟢 已連線: ${gdriveUser.name}` : '🔴 尚未同步'}
                            </div>
                        </div>
                    </div>

                    <nav className="flex gap-2">
                        {['dashboard', 'ledger', 'drive'].map(t => (
                            <button key={t} onClick={() => setActiveTab(t)} className={`flex-1 py-3 rounded-xl border text-sm font-bold transition ${activeTab === t ? 'bg-teal-500/10 border-teal-500 text-teal-400' : 'bg-slate-900 border-slate-800 text-slate-500'}`}>
                                {t === 'dashboard' ? '資產總覽' : t === 'ledger' ? '記帳本' : '同步設定'}
                            </button>
                        ))}
                    </nav>

                    <main className="bg-slate-900 border border-slate-800 rounded-2xl p-6 min-h-[400px]">
                        {activeTab === 'dashboard' && (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead>
                                        <tr className="border-b border-slate-800 text-slate-500">
                                            <th className="pb-4">標的</th><th className="pb-4">股數</th><th className="pb-4">成本價</th><th className="pb-4">總投入</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800/50">
                                        {transactions.map(t => (
                                            <tr key={t.id}>
                                                <td className="py-4 font-bold">{t.symbol}<span className="block text-xs text-slate-500 font-normal">{t.name}</span></td>
                                                <td className="py-4">{t.shares}</td>
                                                <td className="py-4">${t.price}</td>
                                                <td className="py-4 font-mono text-teal-400">${(t.price * t.shares).toLocaleString()}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {activeTab === 'ledger' && (
                            <form onSubmit={handleAddTx} className="max-w-md mx-auto space-y-4">
                                <div className="grid grid-cols-2 gap-2">
                                    <select value={form.market} onChange={e => setForm({...form, market: e.target.value})} className="bg-slate-950 border border-slate-800 p-2 rounded-lg text-sm">
                                        <option value="TW">台股</option><option value="US">美股</option>
                                    </select>
                                    <input placeholder="代號" value={form.symbol} onChange={e => {
                                        const s = e.target.value.toUpperCase();
                                        setForm({...form, symbol: s, name: STOCK_NAMES[s] || ''});
                                    }} className="bg-slate-950 border border-slate-800 p-2 rounded-lg text-sm uppercase"/>
                                </div>
                                <input placeholder="名稱" value={form.name} onChange={e => setForm({...form, name: e.target.value})} className="w-full bg-slate-950 border border-slate-800 p-2 rounded-lg text-sm"/>
                                <div className="grid grid-cols-2 gap-2">
                                    <input type="number" placeholder="單價" value={form.price} onChange={e => setForm({...form, price: e.target.value})} className="bg-slate-950 border border-slate-800 p-2 rounded-lg text-sm"/>
                                    <input type="number" placeholder="股數" value={form.shares} onChange={e => setForm({...form, shares: e.target.value})} className="bg-slate-950 border border-slate-800 p-2 rounded-lg text-sm"/>
                                </div>
                                <button type="submit" className="w-full bg-teal-500 text-slate-900 font-bold py-3 rounded-xl mt-2">新增至持股</button>
                            </form>
                        )}

                        {activeTab === 'drive' && (
                            <div className="max-w-md mx-auto space-y-4 py-8">
                                <input placeholder="貼上 Google Client ID" value={gdriveClientId} onChange={e => setGdriveClientId(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-xs font-mono"/>
                                <button onClick={handleGoogleLogin} className="w-full bg-sky-600 font-bold py-3 rounded-xl">授權 Google 登入</button>
                                <div className="flex gap-2">
                                    <button className="flex-1 bg-slate-800 py-2 rounded-lg text-xs">備份至雲端</button>
                                    <button className="flex-1 bg-slate-800 py-2 rounded-lg text-xs">從雲端還原</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
