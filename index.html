<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>GlowWealth - 強制修復版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');

            // 確保初始化時絕對不會因為壞資料而崩潰
            React.useEffect(() => {
                try {
                    if (!localStorage.getItem('gw_init')) {
                        localStorage.clear();
                        localStorage.setItem('gw_init', 'true');
                    }
                } catch (e) { console.error(e); }
            }, []);

            return (
                <div className="p-6 max-w-2xl mx-auto">
                    <h1 className="text-xl font-bold mb-4">GlowWealth 強制修復版</h1>
                    <div className="flex gap-2 mb-4">
                        {['dashboard', 'ledger', 'dividend', 'drive'].map(t => (
                            <button key={t} onClick={() => setActiveTab(t)} className={`px-4 py-2 rounded ${activeTab === t ? 'bg-blue-600 text-white' : 'bg-white'}`}>
                                {t}
                            </button>
                        ))}
                    </div>
                    <div className="bg-white p-6 rounded shadow">
                        <p>目前分頁: <strong>{activeTab}</strong></p>
                        <p className="text-gray-500 mt-2">如果這頁能看到，代表 React 核心引擎已成功啟動！</p>
                    </div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
