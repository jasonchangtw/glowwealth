<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowWealth - 實時金融同步旗艦版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const STOCK_NAMES = {
            '2330': '台積電', '2317': '鴻海', '2454': '聯發科', '0050': '元大台灣50', '0056': '元大高股息',
            'AAPL': '蘋果', 'TSLA': '特斯拉', 'NVDA': '輝達', 'MSFT': '微軟', 'VOO': 'S&P 500 ETF'
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [currency, setCurrency] = useState('TWD');
            const [exchangeRate, setExchangeRate] = useState(32.5); // 預設，稍後自動更新
            const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('gw_v3_txs') || '[]'));
            const [dividends, setDividends] = useState(() => JSON.parse(localStorage.getItem('gw_v3_divs') || '[]'));
            const [prices, setPrices] = useState({});
            const [isRefreshing, setIsRefreshing] = useState(false);

            // Google Drive 相關
            const [gdriveClientId, setGdriveClientId] = useState(() => localStorage.getItem('gw_client_id') || '');
            const [gdriveToken, setGdriveToken] = useState(null);

            useEffect(() => { localStorage.setItem('gw_v3_txs', JSON.stringify(transactions)); }, [transactions]);
            useEffect(() => { localStorage.setItem('gw_v3_divs', JSON.stringify(dividends)); }, [dividends]);

            // 🚀 功能：實時更新匯率與股價
            const refreshFinData = async () => {
                setIsRefreshing(true);
                try {
                    // 1. 更新匯率 (USD to TWD)
                    const fxRes = await fetch('https://open.er-api.com/v6/latest/USD');
                    const fxData = await fxRes.json();
                    if (fxData.rates.TWD) setExchangeRate(fxData.rates.TWD);

                    // 2. 更新股價 (模擬 API 調用 - 在 GitHub Pages 通常需透過 Proxy)
                    const newPrices = { ...prices };
                    for (const tx of transactions) {
                        if (!newPrices[tx.symbol]) {
                            // 模擬市場波動，實際開發可串接 FinMind 或 Yahoo Finance Proxy
                            const mockVolatility = 1 + (Math.random() * 0.1 - 0.05);
                            newPrices[tx.symbol] = parseFloat(tx.price) * mockVolatility;
                        }
                    }
                    setPrices(newPrices);
                } catch (e) {
                    console.error("金融數據同步失敗");
                } finally {
                    setIsRefreshing(false);
                }
            };

            useEffect(() => { refreshFinData(); }, []);

            // 📊 專家級 Dashboard 計算
            const portfolio = useMemo(() => {
                const summary = {};
                transactions.forEach(tx => {
                    if (!summary[tx.symbol]) summary[tx.symbol] = { ...tx, totalShares: 0, totalCost: 0 };
                    summary[tx.symbol].totalShares += parseFloat(tx.shares);
                    summary[tx.symbol].totalCost += parseFloat(tx.price) * parseFloat(tx.shares);
                });

                return Object.values(summary).map(s => {
                    const currentPrice = prices[s.symbol] || s.price;
                    const marketValue = currentPrice * s.totalShares;
                    const cost = s.totalCost;
                    const profit = marketValue - cost;
                    const roi = (profit / cost) * 100;
                    return { ...s, currentPrice, marketValue, profit, roi };
                });
            }, [transactions, prices]);

            const totals = useMemo(() => {
                let costTwd = 0, valueTwd = 0;
                portfolio.forEach(p => {
                    const factor = p.market === 'TW' ? 1 : exchangeRate;
                    costTwd += p.totalCost * factor;
                    valueTwd += p.marketValue * factor;
                });
                return { costTwd, valueTwd, profitTwd: valueTwd - costTwd };
            }, [portfolio, exchangeRate]);

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-5xl mx-auto space-y-6">
                    <header className="flex justify-between items-center bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
                        <div>
                            <h1 className="text-2xl font-bold bg-gradient-to-r from-teal-400 to-sky-400 bg-clip-text text-transparent">GlowWealth Pro</h1>
                            <p className="text-xs text-slate-500 mt-1">即時匯率: 1 USD = {exchangeRate.toFixed(2)} TWD</p>
                        </div>
                        <button onClick={refreshFinData} disabled={isRefreshing} className="p-2 bg-slate-800 rounded-lg hover:bg-slate-700 transition">
                            <span className={isRefreshing ? "animate-spin inline-block" : ""}>🔄</span>
                        </button>
                    </header>

                    {/* Dashboard 數據卡 */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                            <div className="text-xs text-slate-500 uppercase tracking-wider">資產總現值 ({currency})</div>
                            <div className="text-2xl font-black mt-1">
                                {currency === 'TWD' ? `NT$ ${Math.round(totals.valueTwd).toLocaleString()}` : `$ ${(totals.valueTwd / exchangeRate).toLocaleString()}`}
                            </div>
                        </div>
                        <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                            <div className="text-xs text-slate-500 uppercase tracking-wider">總投資損益</div>
                            <div className={`text-2xl font-black mt-1 ${totals.profitTwd >= 0 ? 'text-rose-500' : 'text-emerald-500'}`}>
                                {totals.profitTwd >= 0 ? '+' : ''}{Math.round(totals.profitTwd).toLocaleString()}
                            </div>
                        </div>
                        <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                            <div className="text-xs text-slate-500 uppercase tracking-wider">投資報酬率</div>
                            <div className={`text-2xl font-black mt-1 ${totals.profitTwd >= 0 ? 'text-rose-500' : 'text-emerald-500'}`}>
                                {((totals.profitTwd / totals.costTwd) * 100 || 0).toFixed(2)}%
                            </div>
                        </div>
                    </div>

                    <nav className="flex gap-2 bg-slate-900 p-1 rounded-xl border border-slate-800">
                        {['dashboard', 'ledger', 'drive'].map(t => (
                            <button key={t} onClick={() => setActiveTab(t)} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${activeTab === t ? 'bg-slate-800 text-teal-400 shadow' : 'text-slate-500'}`}>
                                {t === 'dashboard' ? '資產總覽' : t === 'ledger' ? '記帳流水' : '雲端同步'}
                            </button>
                        ))}
                    </nav>

                    <main className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                        {activeTab === 'dashboard' && (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead>
                                        <tr className="border-b border-slate-800 text-slate-500 text-xs">
                                            <th className="pb-3">標的</th><th className="pb-3">現價</th><th className="pb-3">成本</th><th className="pb-3">損益</th><th className="pb-3">報酬</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800/50">
                                        {portfolio.map(p => (
                                            <tr key={p.symbol} className="hover:bg-slate-800/20">
                                                <td className="py-4">
                                                    <span className="font-bold block">{p.symbol}</span>
                                                    <span className="text-[10px] text-slate-500">{STOCK_NAMES[p.symbol] || ''}</span>
                                                </td>
                                                <td className="py-4 font-mono">${p.currentPrice.toFixed(2)}</td>
                                                <td className="py-4 font-mono">${parseFloat(p.price).toFixed(2)}</td>
                                                <td className={`py-4 font-bold ${p.profit >= 0 ? 'text-rose-500' : 'text-emerald-500'}`}>
                                                    ${Math.round(p.profit).toLocaleString()}
                                                </td>
                                                <td className={`py-4 font-bold ${p.roi >= 0 ? 'text-rose-500' : 'text-emerald-500'}`}>
                                                    {p.roi.toFixed(1)}%
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {activeTab === 'ledger' && (
                            <div className="text-center py-10 text-slate-500 text-xs">
                                點擊「新增交易」開始記帳。系統將自動根據標的帶入名稱。
                            </div>
                        )}

                        {activeTab === 'drive' && (
                            <div className="max-w-xs mx-auto space-y-4 py-6">
                                <input placeholder="Google Client ID" value={gdriveClientId} onChange={e => setGdriveClientId(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-xs font-mono"/>
                                <button className="w-full bg-sky-600 font-bold py-3 rounded-xl text-xs">授權登入 Google Drive</button>
                            </div>
                        )}
                    </main>
                    <footer className="text-center text-[10px] text-slate-700 uppercase tracking-widest">GlowWealth Engine v3.0</footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
