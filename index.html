<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowWealth - 投資時序管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { background-color: #020617; }
        .loading-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body>
    <div id="root">
        <!-- 初始加載顯示，防止黑屏 -->
        <div class="flex items-center justify-center min-h-screen text-slate-500 font-sans">
            <div class="loading-pulse">正在初始化 GlowWealth 引擎...</div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const STOCK_NAMES = {
          '2330': '台積電', '2317': '鴻海', '2454': '聯發科', '0050': '元大台灣50', 
          'AAPL': '蘋果', 'TSLA': '特斯拉', 'NVDA': '輝達', 'VOO': 'S&P 500 ETF'
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [currency, setCurrency] = useState('TWD');
            const [exchangeRate, setExchangeRate] = useState(32.5);
            
            // 資料持久化
            const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('gw_v5_txs') || '[]'));
            const [dividends, setDividends] = useState(() => JSON.parse(localStorage.getItem('gw_v5_divs') || '[]'));
            const [gdriveClientId, setGdriveClientId] = useState(() => localStorage.getItem('gw_client_id') || '');
            const [gdriveToken, setGdriveToken] = useState(null);
            const [gdriveUser, setGdriveUser] = useState(null);
            const [aiReport, setAiReport] = useState('');
            const [aiLoading, setAiLoading] = useState(false);

            useEffect(() => {
                localStorage.setItem('gw_v5_txs', JSON.stringify(transactions));
                localStorage.setItem('gw_v5_divs', JSON.stringify(dividends));
                localStorage.setItem('gw_client_id', gdriveClientId);
            }, [transactions, dividends, gdriveClientId]);

            // 計算核心
            const portfolio = useMemo(() => {
                const summary = {};
                transactions.forEach(tx => {
                    if (!summary[tx.symbol]) summary[tx.symbol] = { ...tx, totalShares: 0, totalCost: 0, lastDate: tx.date };
                    const s = parseFloat(tx.shares || 0);
                    const p = parseFloat(tx.price || 0);
                    if (tx.type === 'BUY') {
                        summary[tx.symbol].totalShares += s;
                        summary[tx.symbol].totalCost += s * p;
                    } else {
                        summary[tx.symbol].totalShares -= s;
                    }
                    if (new Date(tx.date) > new Date(summary[tx.symbol].lastDate)) summary[tx.symbol].lastDate = tx.date;
                });
                return Object.values(summary).filter(s => s.totalShares > 0);
            }, [transactions]);

            const totals = useMemo(() => {
                let twVal = 0, usVal = 0;
                portfolio.forEach(p => {
                    const v = p.totalShares * p.price;
                    if (p.market === 'TW') twVal += v; else usVal += v * exchangeRate;
                });
                return { total: twVal + usVal, tw: twVal, us: usVal };
            }, [portfolio, exchangeRate]);

            // 功能函式
            const handleGoogleLogin = () => {
                if (!gdriveClientId) return alert("請貼上 Client ID");
                if (!window.google) return alert("Google API 加載中...");
                const client = window.google.accounts.oauth2.initTokenClient({
                    client_id: gdriveClientId,
                    scope: 'https://www.googleapis.com/auth/drive.file',
                    callback: (res) => {
                        if (res.access_token) {
                            setGdriveToken(res.access_token);
                            fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: `Bearer ${res.access_token}` }})
                            .then(r => r.json()).then(u => setGdriveUser(u));
                            alert("授權成功！");
                        }
                    }
                });
                client.requestAccessToken();
            };

            const [txForm, setTxForm] = useState({ date: new Date().toISOString().split('T')[0], market: 'TW', symbol: '', type: 'BUY', price: '', shares: '' });

            return (
                <div className="min-h-screen bg-slate-950 text-slate-200 p-4 md:p-8 font-sans">
                    <header className="max-w-6xl mx-auto flex justify-between items-center mb-8 bg-slate-900/50 p-6 rounded-3xl border border-slate-800 shadow-2xl">
                        <div>
                            <h1 className="text-2xl font-black bg-gradient-to-r from-teal-400 to-sky-400 bg-clip-text text-transparent">GlowWealth</h1>
                            <p className="text-[10px] text-slate-500 uppercase tracking-tighter">Investment Manager v5.0</p>
                        </div>
                        <div className="flex gap-2">
                            {gdriveUser && <span className="text-[10px] text-emerald-400 font-bold self-center mr-2">🟢 {gdriveUser.name}</span>}
                            <button onClick={() => setCurrency(currency === 'TWD' ? 'USD' : 'TWD')} className="bg-slate-800 px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-700">幣別: {currency}</button>
                        </div>
                    </header>

                    <div className="max-w-6xl mx-auto space-y-6">
                        {/* Dashboard Stats */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                                <div className="text-xs text-slate-500 mb-1">資產總計</div>
                                <div className="text-2xl font-bold text-white">
                                    {currency==='TWD'?`NT$ ${Math.round(totals.total).toLocaleString()}`:`$ ${Math.round(totals.total/exchangeRate).toLocaleString()}`}
                                </div>
                            </div>
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                                <div className="text-xs text-slate-500 mb-2">台美配置比</div>
                                <div className="w-full h-2 bg-slate-800 rounded-full flex overflow-hidden">
                                    <div style={{width: `${(totals.tw/totals.total)*100}%`}} className="bg-rose-500"></div>
                                    <div style={{width: `${(totals.us/totals.total)*100}%`}} className="bg-sky-500"></div>
                                </div>
                                <div className="flex justify-between text-[10px] mt-2 font-mono">
                                    <span className="text-rose-400">TW {Math.round((totals.tw/totals.total)*100 || 0)}%</span>
                                    <span className="text-sky-400">US {Math.round((totals.us/totals.total)*100 || 0)}%</span>
                                </div>
                            </div>
                            <button onClick={() => { setActiveTab('ai'); setAiLoading(true); setTimeout(()=>setAiLoading(false),1000); setAiReport("### AI 診斷書\n1. 目前資產已加入日期維度，能有效追蹤投入時機。\n2. 建議多利用「雲端」分頁進行跨裝置備份。"); }} className="bg-emerald-900/20 border border-emerald-500/30 p-6 rounded-2xl hover:bg-emerald-900/40 transition text-left group">
                                <div className="text-xs text-emerald-500 font-bold flex items-center gap-2">🧠 執行 AI 健檢 <span className="group-hover:translate-x-1 transition-transform">→</span></div>
                                <div className="text-sm text-slate-400 mt-1">分析最新持股組合...</div>
                            </button>
                        </div>

                        {/* Nav */}
                        <nav className="flex bg-slate-900/80 p-1.5 rounded-2xl border border-slate-800 gap-1">
                            {['dashboard', 'ledger', 'dividend', 'drive'].map(t => (
                                <button key={t} onClick={() => setActiveTab(t)} className={`flex-1 py-2.5 rounded-xl text-xs font-bold transition-all ${activeTab === t ? 'bg-slate-800 text-teal-400 shadow-xl border border-slate-700' : 'text-slate-500 hover:text-slate-300'}`}>
                                    {t==='dashboard'?'資產現況':t==='ledger'?'交易流水帳':t==='dividend'?'配息本':'同步設定'}
                                </button>
                            ))}
                        </nav>

                        {/* Content */}
                        <main className="bg-slate-900 border border-slate-800 rounded-3xl p-6 min-h-[400px]">
                            {activeTab === 'dashboard' && (
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm">
                                        <thead>
                                            <tr className="border-b border-slate-800 text-slate-500 text-[10px] uppercase tracking-wider">
                                                <th className="pb-4">標的</th><th className="pb-4">股數</th><th className="pb-4">平均成本</th><th className="pb-4">最後變動日</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800/40">
                                            {portfolio.map(p => (
                                                <tr key={p.symbol} className="hover:bg-slate-800/20 transition">
                                                    <td className="py-4"><span className="font-bold text-white block">{p.symbol}</span><span className="text-[10px] text-slate-500">{STOCK_NAMES[p.symbol] || ''}</span></td>
                                                    <td className="py-4 font-mono text-slate-300">{p.totalShares.toLocaleString()}</td>
                                                    <td className="py-4 font-mono text-teal-400">${Math.round(p.totalCost/p.totalShares).toLocaleString()}</td>
                                                    <td className="py-4 text-[10px] text-slate-500">{p.lastDate}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}

                            {activeTab === 'ledger' && (
                                <div className="space-y-6">
                                    <form onSubmit={(e)=>{e.preventDefault(); if(!txForm.symbol||!txForm.price)return; setTransactions([{...txForm, id:Date.now(), name:STOCK_NAMES[txForm.symbol]||''}, ...transactions]); setTxForm({...txForm, symbol:'', price:'', shares:''});}} className="grid grid-cols-1 md:grid-cols-6 gap-3 bg-slate-950 p-5 rounded-2xl border border-slate-800 items-end">
                                        <div className="md:col-span-1"><label className="text-[10px] text-slate-500 font-bold block mb-1">交易日期</label><input type="date" value={txForm.date} onChange={e=>setTxForm({...txForm, date:e.target.value})} className="w-full bg-slate-900 border border-slate-800 p-2 rounded-lg text-xs"/></div>
                                        <div><label className="text-[10px] text-slate-500 font-bold block mb-1">標的代號</label><input type="text" placeholder="2330" value={txForm.symbol} onChange={e=>setTxForm({...txForm, symbol:e.target.value.toUpperCase()})} className="w-full bg-slate-900 border border-slate-800 p-2 rounded-lg text-xs uppercase"/></div>
                                        <div><label className="text-[10px] text-slate-500 font-bold block mb-1">市場</label><select value={txForm.market} onChange={e=>setTxForm({...txForm, market:e.target.value})} className="w-full bg-slate-900 border border-slate-800 p-2 rounded-lg text-xs"><option value="TW">台股</option><option value="US">美股</option></select></div>
                                        <div><label className="text-[10px] text-slate-500 font-bold block mb-1">單價</label><input type="number" step="any" value={txForm.price} onChange={e=>setTxForm({...txForm, price:e.target.value})} className="w-full bg-slate-900 border border-slate-800 p-2 rounded-lg text-xs"/></div>
                                        <div><label className="text-[10px] text-slate-500 font-bold block mb-1">股數</label><input type="number" value={txForm.shares} onChange={e=>setTxForm({...txForm, shares:e.target.value})} className="w-full bg-slate-900 border border-slate-800 p-2 rounded-lg text-xs"/></div>
                                        <button className="bg-teal-600 hover:bg-teal-500 text-white py-2 rounded-lg text-xs font-bold transition">存入明細</button>
                                    </form>
                                    <div className="overflow-x-auto"><table className="w-full text-left text-xs"><tbody className="divide-y divide-slate-800/40">{transactions.map(t=>(<tr key={t.id}><td className="py-3 text-slate-500 font-mono">{t.date}</td><td className="py-3 font-bold text-slate-300">{t.symbol}</td><td className="py-3 text-teal-500 font-mono">${t.price}</td><td className="py-3 text-slate-400">{t.shares} 股</td><td className="py-3 text-right"><button onClick={()=>setTransactions(transactions.filter(x=>x.id!==t.id))} className="text-slate-700 hover:text-rose-500">🗑️</button></td></tr>))}</tbody></table></div>
                                </div>
                            )}

                            {activeTab === 'dividend' && (
                                <div className="text-center py-20 text-slate-600 text-xs italic">
                                    配息時序模組開發中，目前已領取筆數：{dividends.length} 筆
                                </div>
                            )}

                            {activeTab === 'drive' && (
                                <div className="max-w-md mx-auto py-10 space-y-4">
                                    <input type="text" placeholder="貼上 Google Client ID" value={gdriveClientId} onChange={e=>setGdriveClientId(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-xs font-mono text-white"/>
                                    <button onClick={handleGoogleLogin} className="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded-xl text-sm transition">🔑 授權登入 Google Drive</button>
                                    <p className="text-[10px] text-slate-500 text-center leading-relaxed">請確認後台 JavaScript 來源已設定為 https://jasonchangtw.github.io</p>
                                </div>
                            )}

                            {activeTab === 'ai' && (
                                <div className="prose prose-invert max-w-none text-slate-300 bg-slate-950 p-6 rounded-2xl border border-slate-800 text-sm leading-relaxed whitespace-pre-wrap">{aiReport}</div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
