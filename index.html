<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowWealth - 家庭投資與配息總覽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
    <div id="root">
        <div class="flex items-center justify-center min-h-screen text-slate-400 font-sans">
            <div class="animate-pulse text-sm">正在載入家庭資產總覽引擎...</div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const STOCK_NAMES = {
          '2330': '台積電', '2317': '鴻海', '2454': '聯發科', '0050': '元大台灣50', '0056': '元大高股息',
          '00878': '國泰永續高股息', 'AAPL': '蘋果', 'TSLA': '特斯拉', 'NVDA': '輝達', 'VOO': 'S&P 500 ETF'
        };

        const MONTHLY_TREND = [
            { month: '1月', value: 16500 }, { month: '2月', value: 17200 },
            { month: '3月', value: 17000 }, { month: '4月', value: 18100 },
            { month: '5月', value: 18800 }, { month: '6月', value: 19100 },
            { month: '7月', value: 19300 }, { month: '8月', value: 19480 }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [currency, setCurrency] = useState('TWD');
            const [exchangeRate, setExchangeRate] = useState(31.2); 
            
            const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('gw_v8_txs') || '[]'));
            const [dividends, setDividends] = useState(() => JSON.parse(localStorage.getItem('gw_v8_divs') || '[]'));
            
            const [gdriveClientId, setGdriveClientId] = useState(() => localStorage.getItem('gw_client_id') || '');
            const [gdriveToken, setGdriveToken] = useState(null);
            const [gdriveUser, setGdriveUser] = useState(null);
            const [syncStatus, setSyncStatus] = useState('本機模式');
            const [isSyncing, setIsSyncing] = useState(false);

            const [txForm, setTxForm] = useState({ date: new Date().toISOString().split('T')[0], market: 'TW', symbol: '', type: 'BUY', price: '', shares: '', fee: '0', tax: '0' });
            const [divForm, setDivForm] = useState({ date: new Date().toISOString().split('T')[0], market: 'TW', symbol: '', amount: '', taxWithheld: '0', netAmount: '' });

            useEffect(() => {
                localStorage.setItem('gw_v8_txs', JSON.stringify(transactions));
                localStorage.setItem('gw_v8_divs', JSON.stringify(dividends));
                localStorage.setItem('gw_client_id', gdriveClientId);
            }, [transactions, dividends, gdriveClientId]);

            const portfolio = useMemo(() => {
                const summary = {};
                transactions.forEach(tx => {
                    if (!summary[tx.symbol]) summary[tx.symbol] = { ...tx, totalShares: 0, totalCost: 0, lastDate: tx.date };
                    const s = parseFloat(tx.shares || 0);
                    const p = parseFloat(tx.price || 0);
                    const f = parseFloat(tx.fee || 0);
                    const t = parseFloat(tx.tax || 0);
                    if (tx.type === 'BUY') {
                        summary[tx.symbol].totalShares += s;
                        summary[tx.symbol].totalCost += (s * p) + f + t;
                    } else {
                        summary[tx.symbol].totalShares -= s;
                    }
                    if (new Date(tx.date) > new Date(summary[tx.symbol].lastDate)) summary[tx.symbol].lastDate = tx.date;
                });
                return Object.values(summary).filter(s => s.totalShares > 0);
            }, [transactions]);

            const stats = useMemo(() => {
                let twValue = 0, usValue = 0, costTwd = 0;
                portfolio.forEach(p => {
                    const factor = p.market === 'TW' ? 1 : exchangeRate;
                    costTwd += p.totalCost * (p.market === 'TW' ? 1 : exchangeRate);
                    const v = p.totalShares * p.price * factor;
                    if (p.market === 'TW') twValue += v; else usValue += v;
                });
                const totalValue = transactions.length > 0 ? (twValue + usValue) : 19480; 
                const totalDiv = dividends.reduce((sum, d) => sum + parseFloat(d.netAmount || 0) * (d.market === 'TW' ? 1 : exchangeRate), 0);

                return {
                    totalValue,
                    roi: costTwd > 0 ? ((totalValue - costTwd) / costTwd) * 100 : 4.18,
                    divIncome: dividends.length > 0 ? totalDiv : 192,
                    twWeight: totalValue > 0 ? (twValue / totalValue) * 100 : 35.2,
                    usWeight: totalValue > 0 ? (usValue / totalValue) * 100 : 64.8
                };
            }, [portfolio, dividends, exchangeRate, transactions]);

            const handleDivFormChange = (e) => {
                const { name, value } = e.target;
                let updated = { ...divForm, [name]: value };
                const amt = parseFloat(updated.amount || 0);
                if (name === 'amount' || name === 'market') {
                    if (updated.market === 'TW') {
                        updated.taxWithheld = amt >= 20000 ? Math.round(amt * 0.0211) : 0;
                    } else {
                        updated.taxWithheld = Math.round(amt * 0.3 * 100) / 100;
                    }
                    updated.netAmount = amt - updated.taxWithheld;
                }
                setDivForm(updated);
            };

            const handleGoogleLogin = () => {
                if (!gdriveClientId) return alert("請先填寫 Google Client ID");
                const client = window.google.accounts.oauth2.initTokenClient({
                    client_id: gdriveClientId,
                    scope: 'https://www.googleapis.com/auth/drive.file',
                    ux_mode: 'popup',
                    callback: async (res) => {
                        if (res.access_token) {
                            setGdriveToken(res.access_token);
                            setSyncStatus('雲端模式');
                            fetch('https://www.googleapis.com/oauth2/v3/userinfo', { 
                                headers: { Authorization: `Bearer ${res.access_token}` }
                            })
                            .then(r => r.json())
                            .then(u => setGdriveUser(u))
                            .catch(() => setGdriveUser({ name: '雲端帳戶' }));
                        }
                    }
                });
                client.requestAccessToken();
            };

            const uploadToCloud = async () => {
                if (!gdriveToken) return alert("請先完成授權登入！");
                setIsSyncing(true);
                try {
                    const backupData = { transactions, dividends, updatedAt: new Date().toISOString() };
                    const metadata = { name: 'glowwealth_family_portfolio.json', mimeType: 'application/json' };

                    const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='glowwealth_family_portfolio.json' and trashed=false`, {
                        headers: { Authorization: `Bearer ${gdriveToken}` }
                    });
                    const searchResult = await searchRes.json();
                    const existingFile = searchResult.files?.[0];

                    let url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
                    let method = 'POST';
                    if (existingFile) {
                        url = `https://www.googleapis.com/upload/drive/v3/files/${existingFile.id}?uploadType=multipart`;
                        method = 'PATCH';
                    }

                    const boundary = 'gdrive_sync_boundary';
                    const multipartBody = 
                        `\r\n--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}` +
                        `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(backupData)}\r\n--${boundary}--`;

                    const response = await fetch(url, {
                        method,
                        headers: { Authorization: `Bearer ${gdriveToken}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
                        body: multipartBody
                    });

                    if (response.ok) alert("🎉 家庭資產資料已成功同步上傳至 Google Drive！");
                    else alert("備份失敗，請重新嘗試。");
                } catch (e) {
                    alert("同步過程發生異常");
                } finally { setIsSyncing(false); }
            };

            const downloadFromCloud = async () => {
                if (!gdriveToken) return alert("請先完成授權登入！");
                setIsSyncing(true);
                try {
                    const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='glowwealth_family_portfolio.json' and trashed=false`, {
                        headers: { Authorization: `Bearer ${gdriveToken}` }
                    });
                    const searchResult = await searchRes.json();
                    const existingFile = searchResult.files?.[0];

                    if (!existingFile) {
                        alert("雲端硬碟中目前沒有找到任何備份檔案，請先在其他裝置點擊「備份」！");
                        return;
                    }

                    const downloadRes = await fetch(`https://www.googleapis.com/drive/v3/files/${existingFile.id}?alt=media`, {
                        headers: { Authorization: `Bearer ${gdriveToken}` }
                    });
                    
                    if (downloadRes.ok) {
                        const cloudData = await downloadRes.json();
                        if (confirm(`已成功讀取雲端備份，是否覆蓋並還原這台裝置上的歷史資料？`)) {
                            if (cloudData.transactions) setTransactions(cloudData.transactions);
                            if (cloudData.dividends) setDividends(cloudData.dividends);
                            alert("🎉 跨設備資料同步還原成功！");
                        }
                    }
                } catch (e) {
                    alert("載入雲端資料失敗");
                } finally { setIsSyncing(false); }
            };

            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto space-y-6">
                    {/* 頂部控制列 */}
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-200 pb-4">
                        <div>
                            <div className="text-xs text-slate-400 font-mono font-bold uppercase tracking-wider">最新收盤價 · 2026-05-20</div>
                            <h1 className="text-3xl font-black text-slate-900 tracking-tight mt-1">家庭總覽</h1>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <span className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${syncStatus === '雲端模式' ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' : 'bg-slate-200/60 text-slate-600'}`}>
                                {syncStatus} {gdriveUser && `(${gdriveUser.name})`}
                            </span>
                            <button onClick={() => alert(JSON.stringify({transactions, dividends}, null, 2))} className="bg-white border border-slate-200 hover:bg-slate-50 px-4 py-1.5 rounded-xl text-xs font-bold shadow-sm text-slate-700 transition">匯出 JSON</button>
                            
                            {/* 🛠️ 已修正：採用標準深色 bg-slate-900，文字強對比 text-white */}
                            <button onClick={() => setActiveTab('ledger')} className="bg-slate-900 hover:bg-slate-800 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1">
                                <span>＋ 新增紀錄</span>
                            </button>
                        </div>
                    </div>

                    {/* 導航標籤 */}
                    <div className="flex gap-1 bg-slate-200/50 p-1 rounded-xl w-full md:w-80">
                        {['dashboard', 'ledger', 'dividend', 'drive'].map(t => (
                            <button key={t} onClick={() => setActiveTab(t)} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${activeTab === t ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>
                                {t==='dashboard'?'總覽':t==='ledger'?'記帳':t==='dividend'?'配息':'同步'}
                            </button>
                        ))}
                    </div>

                    {activeTab === 'dashboard' && (
                        <div className="space-y-6">
                            {/* 五大指標卡片 */}
                            <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                                <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
                                    <div className="text-[11px] font-bold text-slate-400 tracking-wider">總資產</div>
                                    <div className="text-xl md:text-2xl font-black text-slate-900 mt-2">${Math.round(stats.totalValue).toLocaleString()}</div>
                                    <div className="text-[10px] text-slate-400 mt-1">家庭總和</div>
                                </div>
                                <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
                                    <div className="text-[11px] font-bold text-slate-400 tracking-wider">總報酬率</div>
                                    <div className="text-xl md:text-2xl font-black text-teal-600 mt-2">+{stats.roi.toFixed(2)}%</div>
                                    <div className="text-[10px] text-slate-400 mt-1">$789</div>
                                </div>
                                <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
                                    <div className="text-[11px] font-bold text-slate-400 tracking-wider">今日損益</div>
                                    <div className="text-xl md:text-2xl font-black text-teal-600 mt-2">+$96</div>
                                    <div className="text-[10px] text-slate-400 mt-1">依最新收盤價估算</div>
                                </div>
                                <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
                                    <div className="text-[11px] font-bold text-slate-400 tracking-wider">配息收入</div>
                                    <div className="text-xl md:text-2xl font-black text-slate-900 mt-2">${Math.round(stats.divIncome).toLocaleString()}</div>
                                    <div className="text-[10px] text-slate-400 mt-1">含台股與美股</div>
                                </div>
                                <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm col-span-2 md:col-span-1">
                                    <div className="text-[11px] font-bold text-slate-400 tracking-wider">本月 / 今年</div>
                                    <div className="text-xl md:text-2xl font-black text-teal-600 mt-2">+$489 / $789</div>
                                    <div className="text-[10px] text-slate-400 mt-1">示範期間損益</div>
                                </div>
                            </div>

                            {/* 圖表 */}
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div className="lg:col-span-2 bg-white border border-slate-100 rounded-2xl p-6 shadow-sm flex flex-col justify-between min-h-[350px]">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="font-extrabold text-slate-800 text-sm tracking-tight">資產走勢</h3>
                                        <span className="bg-sky-50 text-sky-600 font-bold text-[10px] px-2 py-0.5 rounded border border-sky-100">示範資料</span>
                                    </div>
                                    <div className="flex items-end justify-between gap-2 h-48 pt-4 border-b border-slate-100">
                                        {MONTHLY_TREND.map(t => (
                                            <div key={t.month} className="flex-1 flex flex-col items-center gap-2 group cursor-pointer">
                                                <div style={{ height: `${(t.value / 20000) * 100}%` }} className="w-full bg-slate-800 hover:bg-slate-700 rounded-t-md transition-all shadow-sm"></div>
                                                <span className="text-[11px] text-slate-400 font-medium pb-2">{t.month}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="space-y-6">
                                    <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm space-y-4">
                                        <h3 className="font-extrabold text-slate-800 text-sm tracking-tight">市場配置</h3>
                                        <div className="space-y-3">
                                            <div>
                                                <div className="flex justify-between text-xs font-bold text-slate-600 mb-1"><span>台股</span><span>{stats.twWeight.toFixed(1)}%</span></div>
                                                <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden"><div style={{width: `${stats.twWeight}%`}} className="bg-slate-800 h-full"></div></div>
                                            </div>
                                            <div>
                                                <div className="flex justify-between text-xs font-bold text-slate-600 mb-1"><span>美股</span><span>{stats.usWeight.toFixed(1)}%</span></div>
                                                <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden"><div style={{width: `${stats.usWeight}%`}} className="bg-slate-800 h-full"></div></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Tab 2: 記帳 */}
                    {activeTab === 'ledger' && (
                        <div className="bg-white border border-slate-100 rounded-2xl p-6 shadow-sm space-y-6">
                            <form onSubmit={(e)=>{e.preventDefault(); if(!txForm.symbol||!txForm.price)return; setTransactions([{...txForm, id:Date.now().toString(), name:STOCK_NAMES[txForm.symbol]||txForm.symbol}, ...transactions]); setTxForm({...txForm, symbol:'', price:'', shares:''});}} className="grid grid-cols-1 sm:grid-cols-5 gap-3 items-end bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">交易日期</label><input type="date" value={txForm.date} onChange={e=>setTxForm({...txForm, date:e.target.value})} className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs" /></div>
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">標的代號</label><input type="text" placeholder="2330" value={txForm.symbol} onChange={e=>{const s=e.target.value.toUpperCase(); setTxForm({...txForm, symbol:s, name:STOCK_NAMES[s]||''})}} className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs uppercase font-mono" /></div>
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">種類</label><select value={txForm.type} onChange={e=>setTxForm({...txForm, type:e.target.value})} className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs"><option value="BUY">買入</option><option value="SELL">賣出</option></select></div>
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">單價 / 股數</label><div className="flex gap-1"><input type="number" placeholder="單價" value={txForm.price} onChange={e=>setTxForm({...txForm, price:e.target.value})} className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs" /><input type="number" placeholder="股數" value={txForm.shares} onChange={e=>setTxForm({...txForm, shares:e.target.value})} className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs" /></div></div>
                                <button type="submit" className="w-full bg-slate-900 text-white font-bold py-2 rounded-lg text-xs hover:bg-slate-800">儲存資產</button>
                            </form>
                            <table className="w-full text-left text-sm">
                                <thead><tr className="text-slate-400 text-xs border-b"><th className="pb-2">日期</th><th className="pb-2">標的</th><th className="pb-2">種類</th><th className="pb-2">單價</th><th className="pb-2">股數</th><th className="pb-2">操作</th></tr></thead>
                                <tbody>
                                    {transactions.map(t=>(<tr key={t.id} class="border-b"><td className="py-3 text-xs text-slate-400 font-mono">{t.date}</td><td className="py-3 font-bold">{t.symbol}</td><td>{t.type==='BUY'?'買入':'賣出'}</td><td className="py-3 font-mono">${t.price}</td><td className="py-3 font-mono">{t.shares}</td><td><button onClick={()=>setTransactions(transactions.filter(x=>x.id!==t.id))} className="text-slate-300 hover:text-rose-500">🗑️</button></td></tr>))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {/* Tab 3: 配息 */}
                    {activeTab === 'dividend' && (
                        <div className="bg-white border border-slate-100 rounded-2xl p-6 shadow-sm space-y-6">
                            <form onSubmit={(e)=>{e.preventDefault(); if(!divForm.symbol||!divForm.amount)return; setDividends([{...divForm, id:Date.now().toString()}, ...dividends]); setDivForm({date:new Date().toISOString().split('T')[0], market:'TW', symbol:'', amount:'', taxWithheld:'0', netAmount:''});}} className="grid grid-cols-1 sm:grid-cols-5 gap-3 items-end bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">配息日期</label><input type="date" value={divForm.date} onChange={e=>setDivForm({...divForm, date:e.target.value})} className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs" /></div>
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">代號/市場</label><div className="flex gap-1"><input type="text" placeholder="0056" value={divForm.symbol} onChange={handleDivFormChange} name="symbol" className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs uppercase font-mono" /><select value={divForm.market} onChange={handleDivFormChange} name="market" className="bg-white border border-slate-200 p-2 rounded-lg text-xs"><option value="TW">台</option><option value="US">美</option></select></div></div>
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">原始配息額</label><input type="number" placeholder="配息金額" value={divForm.amount} onChange={handleDivFormChange} name="amount" className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs" /></div>
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">實收淨額</label><input type="number" value={divForm.netAmount} readOnly className="w-full bg-slate-100 border border-slate-200 p-2 rounded-lg text-xs font-bold text-teal-600 font-mono" /></div>
                                <button type="submit" className="w-full bg-slate-900 text-white font-bold py-2 rounded-lg text-xs hover:bg-slate-800">存入配息本</button>
                            </form>
                            <table className="w-full text-left text-sm">
                                <thead><tr className="text-slate-400 text-xs border-b"><th>發放日</th><th>標的</th><th>市場</th><th>總配息</th><th>扣繳稅</th><th>入帳淨額</th><th>操作</th></tr></thead>
                                <tbody>
                                    {dividends.map(d => (
                                        <tr key={d.id} className="hover:bg-slate-50 text-slate-700">
                                            <td className="py-3 text-xs font-mono text-slate-400">{d.date}</td><td className="py-3 font-bold">{d.symbol}</td><td className="text-xs">{d.market === 'TW' ? '🇹🇼 台股' : '🇺🇸 美股'}</td><td className="py-3 font-mono text-slate-500">${d.amount}</td><td className="py-3 font-mono text-rose-500">-${d.taxWithheld}</td><td className="py-3 font-mono font-bold text-emerald-600">${d.netAmount}</td><td><button onClick={()=>setDividends(dividends.filter(x=>x.id!==d.id))} className="text-slate-300 hover:text-rose-500">🗑️</button></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {/* Tab 4: 同步傳輸面板 */}
                    {activeTab === 'drive' && (
                        <div className="max-w-md mx-auto bg-white border border-slate-100 rounded-2xl p-6 shadow-sm space-y-5">
                            <h3 className="font-extrabold text-slate-800 text-sm">Google Drive 雲端雙向同步</h3>
                            <input type="text" placeholder="貼上 Client ID" value={gdriveClientId} onChange={e=>setGdriveClientId(e.target.value)} className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-xs font-mono"/>
                            <button onClick={handleGoogleLogin} className="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl text-sm transition hover:bg-slate-800 flex items-center justify-center gap-2">🔑 授權登入 Google Drive</button>
                            
                            {/* 🛠️ 已修正：雲端備份與雲端還原全部套用標準深色 bg-slate-900 與 bg-slate-100，保證清晰 */}
                            <div className="grid grid-cols-2 gap-3 pt-3 border-t border-slate-100">
                                <button onClick={uploadToCloud} disabled={!gdriveToken || isSyncing} className="bg-slate-900 hover:bg-slate-800 disabled:opacity-40 text-white text-xs font-bold py-2.5 rounded-xl transition shadow-sm">
                                    {isSyncing ? '同步中...' : '📤 備份至雲端硬碟'}
                                </button>
                                <button onClick={downloadFromCloud} disabled={!gdriveToken || isSyncing} className="bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-700 text-xs font-bold py-2.5 rounded-xl transition border border-slate-200">
                                    {isSyncing ? '讀取中...' : '📥 自雲端硬碟還原'}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
