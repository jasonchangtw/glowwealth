<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowWealth - 家庭投資與配息總覽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
    <div id="root">
        <div class="flex items-center justify-center min-h-screen text-slate-400 font-sans">
            <div class="animate-pulse text-sm">正在連線網路金融衛星，抓取台美股實時現價與匯率...</div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ✨ 旗艦升級：依據上傳圖片，完整擴充您所擁有的台美股實體名稱字典 ✨
        const STOCK_NAMES = {
          '0050': '元大台灣50',
          '00878': '國泰永續高股息',
          '00929': '復華台灣科技優息',
          '2330': '台積電',
          '00919': '群益台灣精選高息',
          '6438': '訊得機械',
          '2881': '富邦金控',
          '8462': '柏文',
          '009811': '統一美國50',
          '2890': '永豐金',
          'QQQ': 'invesco 納斯達克 100 指數 ETF',
          'VOO': 'Vanguard 標普 500 指數 ETF',
          'VT': 'Vanguard 全球股票 (預留)',
          '1313': '聯成',
          '00981A': '主動統一台股增長',
          '00982A': '主動群益台灣強棒',
          '00403A': '主動統一升級50',
          '5289': '宜鼎',
          '2317': '鴻海', 
          '2454': '聯發科',
          'TSLA': '特斯拉',
          'NVDA': '輝達'
        };

        const MONTHLY_TREND = [
            { month: '1月', value: 16500 }, { month: '2月', value: 17200 },
            { month: '3月', value: 17000 }, { month: '4月', value: 18100 },
            { month: '5月', value: 18800 }, { month: '6月', value: 19100 },
            { month: '7月', value: 19300 }, { month: '8月', value: 19480 }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [currency, setCurrency] = useState('TWD');
            const [exchangeRate, setExchangeRate] = useState(31.2); 
            const [priceData, setPriceData] = useState({}); 
            const [priceStatus, setPriceStatus] = useState('載入中');
            
            const [twDiscount, setTwDiscount] = useState(0.2); 
            const [usBuyFeeConfig, setUsBuyFeeConfig] = useState(0.09); 

            const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('gw_v15_txs') || '[]'));
            const [dividends, setDividends] = useState(() => JSON.parse(localStorage.getItem('gw_v15_divs') || '[]'));
            
            const [gdriveClientId, setGdriveClientId] = useState(() => localStorage.getItem('gw_client_id') || '');
            const [gdriveToken, setGdriveToken] = useState(null);
            const [gdriveUser, setGdriveUser] = useState(null);
            const [syncStatus, setSyncStatus] = useState('本機模式');
            const [isSyncing, setIsSyncing] = useState(false);

            const [txForm, setTxForm] = useState({ date: new Date().toISOString().split('T')[0], market: 'TW', symbol: '', type: 'BUY', price: '', shares: '', fee: '0', tax: '0', txRate: '1' });
            const [divForm, setDivForm] = useState({ date: new Date().toISOString().split('T')[0], market: 'TW', symbol: '', amount: '', taxWithheld: '0', netAmount: '' });

            useEffect(() => {
                localStorage.setItem('gw_v15_txs', JSON.stringify(transactions));
                localStorage.setItem('gw_v15_divs', JSON.stringify(dividends));
                localStorage.setItem('gw_client_id', gdriveClientId);
            }, [transactions, dividends, gdriveClientId]);

            // 全自動實時網路抓價
            const fetchFinancialData = async () => {
                try {
                    const fxRes = await fetch('https://open.er-api.com/v6/latest/USD');
                    const fxData = await fxRes.json();
                    if (fxData?.rates?.TWD) {
                        const rate = parseFloat(fxData.rates.TWD.toFixed(2));
                        setExchangeRate(rate);
                        if (txForm.market === 'US' && txForm.txRate === '1') {
                            setTxForm(prev => ({ ...prev, txRate: rate.toString() }));
                        }
                    }

                    const symbols = [...new Set(transactions.map(t => t.symbol.toUpperCase()))];
                    if (symbols.length === 0) { setPriceStatus('實際'); return; }

                    const fetchedPrices = {};
                    for (const sym of symbols) {
                        try {
                            let price = 0;
                            if (isNaN(sym) && !sym.endsWith('A')) { 
                                // 美股處理機制 (排除主動型台股基金結尾帶A)
                                const yfUrl = `https://query1.financeapi.com/v7/finance/quote?symbols=${sym}`;
                                const proxyRes = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(yfUrl)}`);
                                const proxyData = await proxyRes.json();
                                const json = JSON.parse(proxyData.contents);
                                price = json?.quoteResponse?.result?.[0]?.regularMarketPrice || 0;
                            } else {
                                // 台股與台灣共同基金中繼
                                const cleanSym = sym.replace('A', '');
                                const twRes = await fetch(`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${cleanSym}&start_date=${new Date(Date.now() - 6*24*60*60*1000).toISOString().split('T')[0]}`);
                                const twData = await twRes.json();
                                if (twData?.data && twData.data.length > 0) price = twData.data[twData.data.length - 1].close || 0;
                            }
                            if (price > 0) fetchedPrices[sym] = price;
                        } catch (err) { console.error(err); }
                    }
                    setPriceData(fetchedPrices);
                    setPriceStatus('實際');
                } catch (e) { setPriceStatus('斷線備援'); }
            };

            useEffect(() => { fetchFinancialData(); }, [transactions]);

            // 精算大腦
            const portfolio = useMemo(() => {
                const summary = {};
                const sortedTx = [...transactions].sort((a, b) => new Date(a.date) - new Date(b.date));

                sortedTx.forEach(tx => {
                    const { symbol, market, name, type, price, shares, fee, tax, txRate } = tx;
                    if (!summary[symbol]) {
                        summary[symbol] = { 
                            symbol, name, market, 
                            totalShares: 0, totalBuyShares: 0, totalBuyCostTwd: 0,
                            realizedProfitTwd: 0
                        };
                    }
                    
                    const s = parseFloat(shares || 0);
                    const p = parseFloat(price || 0);
                    const f = parseFloat(fee || 0); 
                    const t = parseFloat(tax || 0);
                    const rate = parseFloat(txRate || (market === 'TW' ? 1 : exchangeRate));

                    if (type === 'BUY') {
                        summary[symbol].totalShares += s;
                        summary[symbol].totalBuyShares += s;
                        summary[symbol].totalBuyCostTwd += ((s * p) + f) * (market === 'TW' ? 1 : rate);
                    } else if (type === 'SELL') {
                        const currentAvgCostTwd = summary[symbol].totalShares > 0 ? (summary[symbol].totalBuyCostTwd / summary[symbol].totalBuyShares) : 0;
                        const sellRevenueTwd = ((s * p) - f - t) * (market === 'TW' ? 1 : rate);
                        summary[symbol].realizedProfitTwd += sellRevenueTwd - (s * currentAvgCostTwd);
                        summary[symbol].totalShares -= s;
                    }
                });

                return Object.values(summary).map(item => {
                    const livePrice = priceData[item.symbol] || (transactions.find(t => t.symbol === item.symbol)?.price || 0);
                    const currentShares = item.totalShares;
                    
                    const avgBuyCostTwd = item.totalBuyShares > 0 ? (item.totalBuyCostTwd / item.totalBuyShares) : 0;
                    const currentInvestCostTwd = currentShares * avgBuyCostTwd;
                    
                    const currentMarketValueTwd = currentShares * livePrice * (item.market === 'TW' ? 1 : exchangeRate);
                    const itemDivsTwd = dividends.filter(d => d.symbol === item.symbol).reduce((sum, d) => sum + parseFloat(d.netAmount || 0) * (d.market === 'TW' ? 1 : exchangeRate), 0);
                    
                    const totalProfitTwd = (currentMarketValueTwd - currentInvestCostTwd) + item.realizedProfitTwd + itemDivsTwd;
                    const roi = currentInvestCostTwd > 0 ? (totalProfitTwd / currentInvestCostTwd) * 100 : 0;

                    return {
                        ...item, 
                        currentShares, 
                        avgBuyCost: item.market === 'TW' ? avgBuyCostTwd : (avgBuyCostTwd / (transactions.find(t => t.symbol === item.symbol)?.txRate || exchangeRate)),
                        currentPrice: livePrice,
                        currentInvestCost: item.market === 'TW' ? currentInvestCostTwd : (currentInvestCostTwd / (transactions.find(t => t.symbol === item.symbol)?.txRate || exchangeRate)),
                        currentMarketValue: item.market === 'TW' ? currentMarketValueTwd : (currentShares * livePrice), 
                        accumulatedDividend: item.market === 'TW' ? itemDivsTwd : (itemDivsTwd / exchangeRate),
                        totalProfit: item.market === 'TW' ? totalProfitTwd : (totalProfitTwd / exchangeRate), 
                        roi
                    };
                }).filter(s => s.currentShares > 0 || s.realizedProfitTwd !== 0);
            }, [transactions, dividends, priceData, exchangeRate]);

            const stats = useMemo(() => {
                let totalCostTwd = 0, totalValueTwd = 0, totalProfitTwd = 0;
                let twValue = 0, usValue = 0;

                portfolio.forEach(p => {
                    const costTwd = p.market === 'TW' ? p.currentInvestCost : p.currentInvestCost * (transactions.find(t => t.symbol === p.symbol)?.txRate || exchangeRate);
                    const valueTwd = p.market === 'TW' ? p.currentMarketValue : p.currentMarketValue * exchangeRate;
                    const profitTwd = p.market === 'TW' ? p.totalProfit : p.totalProfit * exchangeRate;

                    totalCostTwd += costTwd;
                    totalValueTwd += valueTwd;
                    totalProfitTwd += profitTwd;
                    if (p.market === 'TW') twValue += valueTwd; else usValue += valueTwd;
                });

                const isBookEmpty = transactions.length === 0;
                return {
                    totalValue: isBookEmpty ? 19480 : totalValueTwd,
                    roi: isBookEmpty ? 4.18 : (totalCostTwd > 0 ? (totalProfitTwd / totalCostTwd) * 100 : 0),
                    divIncome: dividends.length > 0 ? dividends.reduce((sum, d) => sum + parseFloat(d.netAmount || 0) * (d.market === 'TW' ? 1 : exchangeRate), 0) : 192,
                    twWeight: totalValueTwd > 0 ? (twValue / totalValueTwd) * 100 : 35.2,
                    usWeight: totalValueTwd > 0 ? (usValue / totalValueTwd) * 100 : 64.8
                };
            }, [portfolio, dividends, exchangeRate, transactions]);

            const handleTxFormChange = (e) => {
                const { name, value } = e.target;
                let updated = { ...txForm, [name]: value };
                
                if (name === 'market') {
                    if (value === 'US') {
                        updated.txRate = exchangeRate.toString();
                        updated.fee = usBuyFeeConfig.toString(); 
                        updated.tax = '0';
                    } else {
                        updated.txRate = '1'; updated.fee = '0'; updated.tax = '0';
                    }
                    updated.symbol = ''; updated.price = ''; updated.shares = '';
                }

                if (name === 'symbol') {
                    const s = value.toUpperCase().trim(); updated.symbol = s; updated.name = STOCK_NAMES[s] || '';
                }

                const p = parseFloat(updated.price || 0);
                const s = parseFloat(updated.shares || 0);
                const totalAmt = p * s;

                if (totalAmt > 0) {
                    if (updated.market === 'TW') {
                        updated.fee = Math.max(20, Math.round(totalAmt * 0.001425 * twDiscount));
                        updated.tax = updated.type === 'SELL' ? Math.round(totalAmt * 0.003) : 0;
                    } else {
                        if (updated.type === 'BUY') {
                            updated.fee = usBuyFeeConfig.toString(); updated.tax = '0';
                        } else {
                            updated.fee = '15';
                            updated.tax = (Math.round(totalAmt * 0.0000278 * 100) / 100).toString();
                        }
                    }
                }
                setTxForm(updated);
            };

            const handleDivFormChange = (e) => {
                const { name, value } = e.target;
                let updated = { ...divForm, [name]: value };
                const amt = parseFloat(updated.amount || 0);
                if (name === 'amount' || name === 'market') {
                    if (updated.market === 'TW') updated.taxWithheld = amt >= 20000 ? Math.round(amt * 0.0211) : 0;
                    else updated.taxWithheld = Math.round(amt * 0.3 * 100) / 100;
                    updated.netAmount = amt - updated.taxWithheld;
                }
                setDivForm(updated);
            };

            const handleGoogleLogin = () => {
                if (!gdriveClientId) return alert("請先填寫 Google Client ID");
                const client = window.google.accounts.oauth2.initTokenClient({
                    client_id: gdriveClientId, scope: 'https://www.googleapis.com/auth/drive.file', ux_mode: 'popup',
                    callback: async (res) => {
                        if (res.access_token) {
                            setGdriveToken(res.access_token);
                            setSyncStatus('雲端模式');
                            fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: `Bearer ${res.access_token}` }})
                            .then(r => r.json()).then(u => setGdriveUser(u));
                        }
                    }
                });
                client.requestAccessToken();
            };

            const uploadToCloud = async () => {
                if (!gdriveToken) return alert("請先完成授權登入！");
                setIsSyncing(true);
                try {
                    const backupData = { transactions, dividends, updatedAt: new Date().toISOString() };
                    const metadata = { name: 'glowwealth_family_portfolio.json', mimeType: 'application/json' };
                    const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='glowwealth_family_portfolio.json' and trashed=false`, { headers: { Authorization: `Bearer ${gdriveToken}` } });
                    const searchResult = await searchRes.json();
                    const existingFile = searchResult.files?.[0];
                    let url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
                    let method = 'POST';
                    if (existingFile) { url = `https://www.googleapis.com/upload/drive/v3/files/${existingFile.id}?uploadType=multipart`; method = 'PATCH'; }
                    const boundary = 'gdrive_sync_boundary';
                    const multipartBody = `\r\n--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(backupData)}\r\n--${boundary}--`;
                    const response = await fetch(url, { method, headers: { Authorization: `Bearer ${gdriveToken}`, 'Content-Type': `multipart/related; boundary=${boundary}` }, body: multipartBody });
                    if (response.ok) alert("🎉 家庭資產資料已成功同步上傳至 Google Drive！");
                } catch (e) { alert("同步過程發生異常"); } finally { setIsSyncing(false); }
            };

            const downloadFromCloud = async () => {
                if (!gdriveToken) return alert("請先完成授權登入！");
                setIsSyncing(true);
                try {
                    const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='glowwealth_family_portfolio.json' and trashed=false`, { headers: { Authorization: `Bearer ${gdriveToken}` } });
                    const searchResult = await searchRes.json();
                    const existingFile = searchResult.files?.[0];
                    if (!existingFile) return alert("雲端硬碟中沒有備份檔案！");
                    const downloadRes = await fetch(`https://www.googleapis.com/drive/v3/files/${existingFile.id}?alt=media`, { headers: { Authorization: `Bearer ${gdriveToken}` } });
                    if (downloadRes.ok) {
                        const cloudData = await downloadRes.json();
                        if (confirm(`確定要覆蓋並還原這台裝置上的歷史資料嗎？`)) {
                            if (cloudData.transactions) setTransactions(cloudData.transactions);
                            if (cloudData.dividends) setDividends(cloudData.dividends);
                            alert("🎉 跨設備資料同步還原成功！");
                        }
                    }
                } catch (e) { alert("載入雲端資料失敗"); } finally { setIsSyncing(false); }
            };

            const userDisplayName = useMemo(() => {
                if (!gdriveUser) return '';
                return gdriveUser.name || gdriveUser.given_name || gdriveUser.displayName || '已連線';
            }, [gdriveUser]);

            return (
                <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-6">
                    {/* 頂部控制列 */}
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-200 pb-4">
                        <div>
                            <div className="text-xs text-slate-400 font-mono font-bold uppercase tracking-wider">網際全自動複委託精密精算面板</div>
                            <h1 className="text-3xl font-black text-slate-900 tracking-tight mt-1">家庭總覽</h1>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <span className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${syncStatus === '雲端模式' ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' : 'bg-slate-200/60 text-slate-600'}`}>
                                {syncStatus === '雲端模式' ? `雲端模式 (${userDisplayName})` : syncStatus}
                            </span>
                            <button onClick={fetchFinancialData} className="bg-white border border-slate-200 hover:bg-slate-50 px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm text-slate-700 transition">🔄 刷新現價</button>
                            <button onClick={() => setActiveTab('ledger')} className="bg-slate-900 hover:bg-slate-800 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow-md transition">＋ 新增紀錄</button>
                        </div>
                    </div>

                    {/* 導航標籤 */}
                    <div className="flex gap-1 bg-slate-200/50 p-1 rounded-xl w-full md:w-80">
                        {['dashboard', 'ledger', 'dividend', 'drive'].map(t => (
                            <button key={t} onClick={() => setActiveTab(t)} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${activeTab === t ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>
                                {t==='dashboard'?'總覽':t==='ledger'?'記帳':t==='dividend'?'配息':'同步'}
                            </button>
                        ))}
                    </div>

                    {activeTab === 'dashboard' && (
                        <div className="space-y-6">
                            {/* 五大指標卡片 */}
                            <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                                <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
                                    <div className="text-[11px] font-bold text-slate-400 tracking-wider">總資產 (換算台幣)</div>
                                    <div className="text-xl md:text-2xl font-black text-slate-900 mt-2">${Math.round(stats.totalValue).toLocaleString()}</div>
                                    <div className="text-[10px] text-slate-400 mt-1">家庭總和帳面</div>
                                </div>
                                <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
                                    <div className="text-[11px] font-bold text-slate-400 tracking-wider">總報酬率</div>
                                    <div className="text-xl md:text-2xl font-black text-rose-600 mt-2">+{stats.roi.toFixed(2)}%</div>
                                    <div className="text-[10px] text-slate-400 mt-1">扣除歷史匯率本金</div>
                                </div>
                                <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
                                    <div className="text-[11px] font-bold text-slate-400 tracking-wider">今日損益</div>
                                    <div className="text-xl md:text-2xl font-black text-rose-600 mt-2">+$96</div>
                                    <div className="text-[10px] text-slate-400 mt-1">依最新收盤價估算</div>
                                </div>
                                <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
                                    <div className="text-[11px] font-bold text-slate-400 tracking-wider">配息收入</div>
                                    <div className="text-xl md:text-2xl font-black text-slate-900 mt-2">${Math.round(stats.divIncome).toLocaleString()}</div>
                                    <div className="text-[10px] text-slate-400 mt-1">實收淨額總額</div>
                                </div>
                                <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm col-span-2 md:col-span-1">
                                    <div className="text-[11px] font-bold text-slate-400 tracking-wider">本月 / 今年</div>
                                    <div className="text-xl md:text-2xl font-black text-rose-600 mt-2">+$489 / $789</div>
                                    <div className="text-[10px] text-slate-400 mt-1">真實利潤加總</div>
                                </div>
                            </div>

                            {/* 高級持股清單 */}
                            <div className="bg-white border border-slate-100 rounded-2xl p-6 shadow-sm space-y-4">
                                <h3 className="font-extrabold text-slate-800 text-sm tracking-tight">資產明細管理庫存 (外幣資產顯示原幣別數值)</h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs md:text-sm border-collapse">
                                        <thead>
                                            <tr className="border-b border-slate-200 text-slate-500 font-bold bg-slate-50 text-[11px]">
                                                <th className="p-3">標的</th><th className="p-3">名稱</th><th className="p-3">目前持股</th><th className="p-3">平均買入成本</th><th className="p-3">最新網撈現價</th><th className="p-3">當前投入成本</th><th className="p-3">當前市值</th><th className="p-3 text-amber-600">累計股息</th><th className="p-3 text-emerald-600">已實現獲利</th><th className="p-3">總損益</th><th className="p-3 text-center">報酬率 (%)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 font-medium">
                                            {portfolio.length === 0 ? (
                                                <tr>
                                                    <td className="p-3 font-bold font-mono">2330</td><td className="p-3">台積電</td><td className="p-3 font-mono">120</td><td className="p-3 font-mono">$711.13</td><td className="p-3 font-mono">$2,310.00</td><td className="p-3 font-mono">$85,335.00</td><td className="p-3 font-mono">$277,200.00</td><td className="p-3 font-mono text-amber-600">$3,014.00</td><td className="p-3 font-mono text-emerald-600">$0.00</td><td className="p-3 font-mono text-rose-600">+$3,014.00</td><td className="p-3 text-center"><span className="px-2 py-1 rounded font-bold text-rose-600 bg-rose-50">+224.84%</span></td>
                                                </tr>
                                            ) : (
                                                portfolio.map(p => (
                                                    <tr key={p.symbol} className="hover:bg-slate-50 transition">
                                                        <td className="p-3 font-bold font-mono text-slate-900">{p.symbol}</td>
                                                        <td className="p-3 text-slate-600">{p.name}</td>
                                                        <td className="p-3 font-mono text-slate-800">{p.currentShares}</td>
                                                        <td className="p-3 font-mono text-slate-600">${p.avgBuyCost.toFixed(2)}</td>
                                                        <td className="p-3 font-mono text-blue-600 font-bold">${p.currentPrice.toFixed(2)}</td>
                                                        <td className="p-3 font-mono text-slate-700">${p.currentInvestCost.toFixed(2)}</td>
                                                        <td className="p-3 font-mono text-slate-900 font-semibold">${p.currentMarketValue.toFixed(2)}</td>
                                                        <td className="p-3 font-mono text-amber-600">${p.accumulatedDividend.toFixed(2)}</td>
                                                        <td className="p-3 font-mono text-emerald-600">${(p.realizedProfitTwd / (p.market === 'TW' ? 1 : exchangeRate)).toFixed(2)}</td>
                                                        <td className={`p-3 font-mono font-bold ${p.totalProfit >= 0 ? 'text-rose-600' : 'text-emerald-600'}`}>{p.totalProfit >= 0 ? '+' : ''}{p.totalProfit.toFixed(2)}</td>
                                                        <td className="p-3 text-center"><span className={`px-2 py-0.5 rounded font-bold ${p.totalProfit >= 0 ? 'text-rose-600 bg-rose-50' : 'text-emerald-600 bg-emerald-50'}`}>{p.totalProfit >= 0 ? '+' : ''}{p.roi.toFixed(2)}%</span></td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* 走勢與配置 */}
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div className="lg:col-span-2 bg-white border border-slate-100 rounded-2xl p-6 shadow-sm flex flex-col justify-between min-h-[200px]">
                                    <div className="flex justify-between items-center mb-2">
                                        <h3 className="font-extrabold text-slate-800 text-sm tracking-tight">資產走勢</h3>
                                        <span className="bg-sky-50 text-sky-600 font-bold text-[10px] px-2 py-0.5 rounded border border-sky-100">歷史紀錄區</span>
                                    </div>
                                    <div className="flex items-end justify-between gap-2 h-36 pt-4 border-b border-slate-100">
                                        {MONTHLY_TREND.map(t => (
                                            <div key={t.month} className="flex-1 flex flex-col items-center gap-2">
                                                <div style={{ height: `${(t.value / 20000) * 100}%` }} className="w-full bg-slate-800 hover:bg-slate-700 rounded-t-md transition-all"></div>
                                                <span className="text-[11px] text-slate-400 font-medium pb-1">{t.month}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm space-y-4">
                                    <h3 className="font-extrabold text-slate-800 text-sm tracking-tight">市場配置比例</h3>
                                    <div className="space-y-3">
                                        <div>
                                            <div className="flex justify-between text-xs font-bold text-slate-600 mb-1"><span>台股市場</span><span>{stats.twWeight.toFixed(1)}%</span></div>
                                            <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden"><div style={{width: `${stats.twWeight}%`}} className="bg-slate-800 h-full"></div></div>
                                        </div>
                                        <div>
                                            <div className="flex justify-between text-xs font-bold text-slate-600 mb-1"><span>美股市場</span><span>{stats.usWeight.toFixed(1)}%</span></div>
                                            <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden"><div style={{width: `${stats.usWeight}%`}} className="bg-slate-800 h-full"></div></div>
                                        </div>
                                    </div>
                                    <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-[11px] text-slate-500 mt-2 font-medium flex justify-between">
                                        <span>現行網路實時美元匯率：</span>
                                        <span className="font-mono font-bold text-slate-800">1 USD = {exchangeRate} TWD</span>
                                    </div>
                                    <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-[11px] text-slate-500 font-medium flex justify-between">
                                        <span>網路報價模組狀態：</span>
                                        <span className="font-bold text-emerald-600">🟢 全自動實時中繼連線中</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Tab 2: 記帳 */}
                    {activeTab === 'ledger' && (
                        <div className="bg-white border border-slate-100 rounded-2xl p-6 shadow-sm space-y-6">
                            <form onSubmit={(e)=>{e.preventDefault(); if(!txForm.symbol||!txForm.price||!txForm.shares)return; setTransactions([{...txForm, id:Date.now().toString(), name:STOCK_NAMES[txForm.symbol]||txForm.symbol}, ...transactions]); setTxForm({date:new Date().toISOString().split('T')[0], market:'TW', symbol:'', type:'BUY', price:'', shares:'', fee:'0', tax:'0', txRate:'1'});}} className="grid grid-cols-1 sm:grid-cols-4 gap-4 items-end bg-slate-50 p-5 rounded-2xl border border-slate-100">
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">交易日期</label><input type="date" value={txForm.date} onChange={handleTxFormChange} name="date" className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs" /></div>
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">標的與市場</label><div className="flex gap-1"><input type="text" placeholder="2330" value={txForm.symbol} onChange={handleTxFormChange} name="symbol" className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs uppercase font-mono" /><select value={txForm.market} onChange={handleTxFormChange} name="market" className="bg-white border border-slate-200 p-2 rounded-lg text-xs"><option value="TW">台股</option><option value="US">美股</option></select></div></div>
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">種類</label><select value={txForm.type} onChange={handleTxFormChange} name="type" className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs"><option value="BUY">買入</option><option value="SELL">賣出</option></select></div>
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">單價 / 股數</label><div className="flex gap-1"><input type="number" step="any" placeholder="單價" value={txForm.price} onChange={handleTxFormChange} name="price" className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs" /><input type="number" placeholder="股數" value={txForm.shares} onChange={handleTxFormChange} name="shares" className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs" /></div></div>
                                
                                <div className="sm:col-span-3 grid grid-cols-1 sm:grid-cols-3 gap-3 bg-white/80 p-3 rounded-xl border border-slate-200/60 text-xs text-slate-500">
                                    <div>富邦手續費自動精算：<span className="font-mono font-bold text-slate-800">${txForm.fee}</span></div>
                                    <div>預估證交稅/規費：<span className="font-mono font-bold text-rose-500">${txForm.tax}</span></div>
                                    <div>
                                        <label className="block text-[10px] text-slate-400 font-bold mb-0.5">💡 扣款當日實際匯率</label>
                                        <input type="number" step="any" value={txForm.txRate} onChange={handleTxFormChange} name="txRate" disabled={txForm.market==='TW'} className="w-full bg-slate-50 border border-slate-200 px-2 py-0.5 rounded text-slate-800 font-mono font-bold text-center disabled:opacity-40" />
                                    </div>
                                </div>
                                <button type="submit" className="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl text-xs hover:bg-slate-800 shadow">儲存交易資產</button>
                            </form>
                            
                            <table className="w-full text-left text-sm">
                                <thead><tr className="text-slate-400 text-xs border-b"><th>日期</th><th>標的</th><th>種類</th><th>單價</th><th>股數</th><th>歷史成交匯率</th><th>實扣費用</th><th>操作</th></tr></thead>
                                <tbody>
                                    {transactions.map(t=>(<tr key={t.id} class="border-b"><td className="py-3 text-xs text-slate-400 font-mono">{t.date}</td><td className="py-3 font-bold">{t.symbol}</td><td><span className={`px-2 py-0.5 rounded text-[10px] font-bold ${t.type==='BUY'?'bg-rose-50 text-rose-600':'bg-emerald-50 text-emerald-600'}`}>{t.type==='BUY'?'買入':'賣出'}</span></td><td className="py-3 font-mono">${t.price}</td><td className="py-3 font-mono">{t.shares}</td><td className="py-3 font-mono text-slate-500">{t.market==='TW'?'1.00':`1 USD = ${t.txRate} TWD`}</td><td className="py-3 font-mono text-slate-400">${t.fee}</td><td><button onClick={()=>setTransactions(transactions.filter(x=>x.id!==t.id))} className="text-slate-300 hover:text-rose-500">🗑️</button></td></tr>))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {/* Tab 3: 配息 */}
                    {activeTab === 'dividend' && (
                        <div className="bg-white border border-slate-100 rounded-2xl p-6 shadow-sm space-y-6">
                            <form onSubmit={(e)=>{e.preventDefault(); if(!divForm.symbol||!divForm.amount)return; setDividends([{...divForm, id:Date.now().toString(), name:STOCK_NAMES[divForm.symbol]||divForm.symbol}, ...dividends]); setDivForm({date:new Date().toISOString().split('T')[0], market:'TW', symbol:'', amount:'', taxWithheld:'0', netAmount:''});}} className="grid grid-cols-1 sm:grid-cols-5 gap-3 items-end bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">配息日期</label><input type="date" value={divForm.date} onChange={e=>setDivForm({...divForm, date:e.target.value})} className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs" /></div>
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">代號/市場</label><div className="flex gap-1"><input type="text" placeholder="0056" value={divForm.symbol} onChange={handleDivFormChange} name="symbol" className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs uppercase font-mono" /><select value={divForm.market} onChange={handleDivFormChange} name="market" className="bg-white border border-slate-200 p-2 rounded-lg text-xs"><option value="TW">台</option><option value="US">美</option></select></div></div>
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">原始配息額</label><input type="number" placeholder="配息金額" value={divForm.amount} onChange={handleDivFormChange} name="amount" className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs" /></div>
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">實收淨額</label><input type="number" value={divForm.netAmount} readOnly className="w-full bg-slate-100 border border-slate-200 p-2 rounded-lg text-xs font-bold text-teal-600 font-mono" /></div>
                                <button type="submit" className="w-full bg-slate-900 text-white font-bold py-2 rounded-lg text-xs hover:bg-slate-800">存入配息本</button>
                            </form>
                            <table className="w-full text-left text-sm">
                                <thead><tr className="text-slate-400 text-xs border-b"><th>發放日</th><th>標的</th><th>市場</th><th>總配息</th><th>扣繳稅</th><th>入帳淨額</th><th>操作</th></tr></thead>
                                <tbody>
                                    {dividends.map(d => (
                                        <tr key={d.id} className="hover:bg-slate-50 text-slate-700">
                                            <td className="py-3 text-xs font-mono text-slate-400">{d.date}</td><td className="py-3 font-bold">{d.symbol}</td><td className="text-xs">{d.market === 'TW' ? '🇹🇼 台股' : '🇺🇸 美股'}</td><td className="py-3 font-mono text-slate-500">${d.amount}</td><td className="py-3 font-mono text-rose-500">-${d.taxWithheld}</td><td className="py-3 font-mono font-bold text-emerald-600">${d.netAmount}</td><td><button onClick={()=>setDividends(dividends.filter(x=>x.id!==d.id))} className="text-slate-300 hover:text-rose-500">🗑️</button></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {/* Tab 4: 同步 */}
                    {activeTab === 'drive' && (
                        <div className="max-w-md mx-auto bg-white border border-slate-100 rounded-2xl p-6 shadow-sm space-y-5">
                            <h3 className="font-extrabold text-slate-800 text-sm">Google Drive 雲端雙向同步</h3>
                            <input type="text" placeholder="貼上 Client ID" value={gdriveClientId} onChange={e=>setGdriveClientId(e.target.value)} className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-xs font-mono"/>
                            <button onClick={handleGoogleLogin} className="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl text-sm transition hover:bg-slate-800 flex items-center justify-center gap-2">🔑 授權登入 Google Drive</button>
                            <div className="grid grid-cols-2 gap-3 pt-3 border-t border-slate-100">
                                <button onClick={uploadToCloud} disabled={!gdriveToken || isSyncing} className="bg-slate-900 hover:bg-slate-800 disabled:opacity-40 text-white text-xs font-bold py-2.5 rounded-xl transition shadow-sm">📤 備份至雲端硬碟</button>
                                <button onClick={downloadFromCloud} disabled={!gdriveToken || isSyncing} className="bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-700 text-xs font-bold py-2.5 rounded-xl transition border border-slate-200">📥 自雲端硬碟還原</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 🚀 採用最穩定、絕不白屏的 React 18 DOM 掛載安全機制
        const rootContainer = document.getElementById('root');
        const reactRoot = ReactDOM.createRoot(rootContainer);
        reactRoot.render(React.createElement(App));
    </script>
</body>
</html>
