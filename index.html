<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowWealth - 家庭投資與配息總覽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
    <div id="root">
        <div class="flex items-center justify-center min-h-screen text-slate-400 font-sans">
            <div class="animate-pulse text-sm">正在連線金融官方端點，載入台美股最新行情與匯率...</div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const STOCK_NAMES = {
          '0050': '元大台灣50', '00878': '國泰永續高股息', '00929': '復華台灣科技優息', '2330': '台積電',
          '00919': '群益台灣精選高息', '6438': '訊得機械', '2881': '富邦金控', '8462': '柏文', '009811': '統一美國50',
          '2890': '永豐金', '6919': '康霈*', 'QQQ': 'invesco 納斯達克 100 指數 ETF', 'VOO': 'Vanguard 標普 500 指數 ETF',
          'VT': 'Vanguard 全球股票', '1313': '聯成', '00981A': '主動統一台股增長', '00982A': '主動群益台灣強棒',
          '00403A': '主動統一升級50', '5289': '宜鼎', '2317': '鴻海', '2454': '聯發科', 'TSLA': '特斯拉', 'NVDA': '輝達'
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [exchangeRate, setExchangeRate] = useState(31.5); 
            const [priceData, setPriceData] = useState({}); 
            const [priceStatus, setPriceStatus] = useState('更新中');
            
            const [twDiscount] = useState(0.2); 
            const [usBuyFeeConfig] = useState(0.09); 

            const [transactions, setTransactions] = useState(() => {
                try {
                    const saved = localStorage.getItem('gw_v15_txs') || localStorage.getItem('gw_data');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });

            const [dividends, setDividends] = useState(() => {
                try { return JSON.parse(localStorage.getItem('gw_v15_divs') || '[]'); } catch(e) { return []; }
            });

            const [txForm, setTxForm] = useState({ date: new Date().toISOString().split('T')[0], symbol: '', type: 'BUY', price: '', shares: '', fee: '20', tax: '0', txRate: '1' });
            const [divForm, setDivForm] = useState({ date: new Date().toISOString().split('T')[0], market: 'TW', symbol: '', netAmount: '' });

            useEffect(() => {
                localStorage.setItem('gw_v15_txs', JSON.stringify(transactions));
                localStorage.setItem('gw_data', JSON.stringify(transactions));
                localStorage.setItem('gw_v15_divs', JSON.stringify(dividends));
            }, [transactions, dividends]);

            // 官方批量整合抓價核心（TWSE/TPEx + 美股雙通道）
            const fetchFinancialData = async () => {
                try {
                    setPriceStatus('連線中');

                    // 1. 抓取匯率
                    try {
                        const fxRes = await fetch('https://open.er-api.com/v6/latest/USD');
                        const fxData = await fxRes.json();
                        if (fxData?.rates?.TWD) {
                            setExchangeRate(parseFloat(fxData.rates.TWD.toFixed(2)));
                        }
                    } catch (fxErr) {
                        console.warn('匯率抓取失敗，維持現有匯率', fxErr);
                    }

                    if (!transactions || transactions.length === 0) {
                        setPriceStatus('實際');
                        return;
                    }

                    const symbols = [...new Set(transactions.filter(t => t && t.symbol).map(t => t.symbol.toUpperCase().trim()))];
                    const fetchedPrices = { ...priceData };

                    const twSymbols = [];
                    const usSymbols = [];

                    symbols.forEach(sym => {
                        const isUs = isNaN(sym) && !sym.endsWith('A');
                        if (isUs) usSymbols.push(sym);
                        else twSymbols.push(sym);
                    });

                    // 2. 台股官方端點批量抓取（同時涵蓋上市與上櫃）
                    if (twSymbols.length > 0) {
                        try {
                            const queryChannels = twSymbols.flatMap(s => {
                                const clean = s.replace(/[^0-9]/g, '');
                                return [`tse_${clean}.tw`, `otc_${clean}.tw`];
                            }).join('|');

                            const twseUrl = `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${queryChannels}&json=1&delay=0`;
                            const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(twseUrl)}`;
                            
                            const twRes = await fetch(proxyUrl);
                            const twJson = await twRes.json();
                            
                            if (twJson?.msgArray && twJson.msgArray.length > 0) {
                                twJson.msgArray.forEach(item => {
                                    const code = item.c;
                                    const rawPrice = item.z && item.z !== '-' ? item.z : item.y;
                                    const price = parseFloat(rawPrice);
                                    if (!isNaN(price) && price > 0) {
                                        const origSym = twSymbols.find(s => s.replace(/[^0-9]/g, '') === code);
                                        if (origSym) fetchedPrices[origSym] = price;
                                    }
                                });
                            }
                        } catch (twErr) {
                            console.warn('台股官方介面異常，切換備用通道:', twErr);
                            await Promise.allSettled(twSymbols.map(async (sym) => {
                                try {
                                    const clean = sym.replace(/[^0-9]/g, '');
                                    const startDate = new Date(Date.now() - 14 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                                    const res = await fetch(`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${clean}&start_date=${startDate}`);
                                    const d = await res.json();
                                    if (d?.data?.length > 0) {
                                        const p = parseFloat(d.data[d.data.length - 1].close);
                                        if (!isNaN(p) && p > 0) fetchedPrices[sym] = p;
                                    }
                                } catch (e) {}
                            }));
                        }
                    }

                    // 3. 美股雙通道抓取
                    if (usSymbols.length > 0) {
                        await Promise.allSettled(usSymbols.map(async (sym) => {
                            let price = 0;
                            try {
                                const stooqUrl = `https://stooq.com/q/l/?s=${sym.toLowerCase()}.us&f=sd2t2ohlcv&h&e=csv`;
                                const res = await fetch(`https://corsproxy.io/?url=${encodeURIComponent(stooqUrl)}`);
                                const csvText = await res.text();
                                const lines = csvText.trim().split('\n');
                                if (lines.length > 1) {
                                    const cols = lines[1].split(',');
                                    const closeVal = parseFloat(cols[6]);
                                    if (!isNaN(closeVal) && closeVal > 0) price = closeVal;
                                }
                            } catch (e1) {}

                            if (!price) {
                                try {
                                    const yfUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}`;
                                    const res = await fetch(`https://corsproxy.io/?url=${encodeURIComponent(yfUrl)}`);
                                    const d = await res.json();
                                    const p = d?.chart?.result?.[0]?.meta?.regularMarketPrice;
                                    if (p && p > 0) price = p;
                                } catch (e2) {}
                            }

                            if (price > 0) fetchedPrices[sym] = price;
                        }));
                    }

                    setPriceData(fetchedPrices);
                    setPriceStatus('實際');
                } catch (e) {
                    console.error('抓價流程異常:', e);
                    setPriceStatus('部分備援');
                }
            };

            useEffect(() => { fetchFinancialData(); }, [transactions]);

            // 資產統計運算核心
            const portfolio = useMemo(() => {
                const summary = {};
                if (!transactions || !Array.isArray(transactions)) return [];
                
                const sortedTx = [...transactions].filter(t => t && t.symbol).sort((a, b) => new Date(a.date) - new Date(b.date));

                sortedTx.forEach(tx => {
                    const { symbol, name, type, price, shares, fee, tax, txRate } = tx;
                    const cleanSymbol = symbol.toUpperCase().trim();
                    const isUs = isNaN(cleanSymbol) && !cleanSymbol.endsWith('A');

                    if (!summary[cleanSymbol]) {
                        summary[cleanSymbol] = { 
                            symbol: cleanSymbol, 
                            name: STOCK_NAMES[cleanSymbol] || name || cleanSymbol, 
                            market: isUs ? 'US' : 'TW', 
                            totalShares: 0, 
                            totalBuyShares: 0, 
                            totalBuyCostTwd: 0, 
                            realizedProfitTwd: 0
                        };
                    }
                    
                    const s = parseFloat(shares || 0);
                    const p = parseFloat(price || 0);
                    const f = parseFloat(fee || 0);
                    const t = parseFloat(tax || 0);
                    const rate = parseFloat(txRate || (isUs ? exchangeRate : 1));

                    if (type === 'BUY') {
                        summary[cleanSymbol].totalShares += s;
                        summary[cleanSymbol].totalBuyShares += s;
                        summary[cleanSymbol].totalBuyCostTwd += ((s * p) + f) * (isUs ? rate : 1);
                    } else if (type === 'SELL') {
                        const currentAvgCostTwd = summary[cleanSymbol].totalShares > 0 ? (summary[cleanSymbol].totalBuyCostTwd / summary[cleanSymbol].totalBuyShares) : 0;
                        const sellRevenueTwd = ((s * p) - f - t) * (isUs ? rate : 1);
                        summary[cleanSymbol].realizedProfitTwd += sellRevenueTwd - (s * currentAvgCostTwd);
                        summary[cleanSymbol].totalShares -= s;
                    }
                });

                return Object.values(summary).map(item => {
                    const livePrice = priceData[item.symbol] || 0;
                    const currentShares = item.totalShares || 0;
                    const avgBuyCostTwd = item.totalBuyShares > 0 ? (item.totalBuyCostTwd / item.totalBuyShares) : 0;
                    const currentInvestCostTwd = currentShares * avgBuyCostTwd;
                    const currentMarketValueTwd = currentShares * livePrice * (item.market === 'US' ? exchangeRate : 1);
                    
                    const itemDivsTwd = dividends ? dividends.filter(d => d && d.symbol && d.symbol.toUpperCase().trim() === item.symbol).reduce((sum, d) => sum + parseFloat(d.netAmount || 0) * (d.market === 'US' ? exchangeRate : 1), 0) : 0;
                    const totalProfitTwd = (currentMarketValueTwd - currentInvestCostTwd) + item.realizedProfitTwd + itemDivsTwd;
                    const roi = currentInvestCostTwd > 0 ? (totalProfitTwd / currentInvestCostTwd) * 100 : 0;

                    const matchTx = transactions.find(t => t && t.symbol && t.symbol.toUpperCase().trim() === item.symbol);
                    const historicalRate = matchTx ? parseFloat(matchTx.txRate || exchangeRate) : exchangeRate;

                    return {
                        ...item, 
                        currentShares, 
                        avgBuyCost: item.market === 'TW' ? avgBuyCostTwd : (avgBuyCostTwd / (historicalRate || exchangeRate)),
                        currentPrice: livePrice || (matchTx ? parseFloat(matchTx.price || 0) : 0),
                        currentInvestCost: item.market === 'TW' ? currentInvestCostTwd : (currentInvestCostTwd / (historicalRate || exchangeRate)),
                        currentMarketValue: item.market === 'TW' ? currentMarketValueTwd : (currentShares * (livePrice || (matchTx ? parseFloat(matchTx.price || 0) : 0))), 
                        accumulatedDividend: item.market === 'TW' ? itemDivsTwd : (itemDivsTwd / exchangeRate),
                        totalProfit: item.market === 'TW' ? totalProfitTwd : (totalProfitTwd / exchangeRate), 
                        roi
                    };
                }).filter(s => s && (s.currentShares > 0 || s.realizedProfitTwd !== 0));
            }, [transactions, dividends, priceData, exchangeRate]);

            const stats = useMemo(() => {
                let totalCostTwd = 0, totalValueTwd = 0, totalProfitTwd = 0;
                portfolio.forEach(p => {
                    const matchTx = transactions.find(t => t && t.symbol && t.symbol.toUpperCase().trim() === p.symbol);
                    const historicalRate = matchTx ? parseFloat(matchTx.txRate || exchangeRate) : exchangeRate;
                    const costTwd = p.market === 'TW' ? p.currentInvestCost : p.currentInvestCost * historicalRate;
                    const valueTwd = p.market === 'TW' ? p.currentMarketValue : p.currentMarketValue * exchangeRate;
                    const profitTwd = p.market === 'TW' ? p.totalProfit : p.totalProfit * exchangeRate;
                    totalCostTwd += costTwd;
                    totalValueTwd += valueTwd;
                    totalProfitTwd += profitTwd;
                });
                return {
                    totalValue: totalValueTwd,
                    roi: totalCostTwd > 0 ? (totalProfitTwd / totalCostTwd) * 100 : 0,
                    divIncome: dividends && dividends.length > 0 ? dividends.reduce((sum, d) => sum + (d ? parseFloat(d.netAmount || 0) : 0) * (d && d.market === 'TW' ? 1 : exchangeRate), 0) : 0
                };
            }, [portfolio, dividends, exchangeRate, transactions]);

            const handleFormInput = (e) => {
                const { name, value } = e.target;
                let updated = { ...txForm, [name]: value };

                if (name === 'symbol') {
                    const cleanSym = value.toUpperCase().trim();
                    updated.symbol = cleanSym;
                    const isUs = isNaN(cleanSym) && !cleanSym.endsWith('A');
                    if (isUs) {
                        updated.txRate = exchangeRate.toString();
                        updated.fee = usBuyFeeConfig.toString();
                        updated.tax = '0';
                    } else {
                        updated.txRate = '1';
                        updated.fee = '20';
                        updated.tax = '0';
                    }
                }

                const p = parseFloat(updated.price || 0);
                const s = parseFloat(updated.shares || 0);
                const total = p * s;
                const isUsAsset = isNaN(updated.symbol) && !updated.symbol.endsWith('A');

                if (total > 0) {
                    if (!isUsAsset) {
                        updated.fee = Math.max(20, Math.round(total * 0.001425 * twDiscount)).toString();
                        updated.tax = updated.type === 'SELL' ? Math.round(total * 0.003).toString() : '0';
                    } else {
                        if (updated.type === 'BUY') { updated.fee = usBuyFeeConfig.toString(); updated.tax = '0'; }
                        else { updated.fee = '15'; updated.tax = (Math.round(total * 0.0000278 * 100) / 100).toString(); }
                    }
                }
                setTxForm(updated);
            };

            return (
                <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-200 pb-4">
                        <div>
                            <div className="text-xs text-slate-400 font-mono font-bold uppercase tracking-wider">投資總覽 (當前匯率: {exchangeRate})</div>
                            <h1 className="text-3xl font-black text-slate-900 tracking-tight mt-1">家庭投資總覽</h1>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <button onClick={fetchFinancialData} className="bg-white border border-slate-200 hover:bg-slate-50 px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm text-slate-700 transition">🔄 刷新現價 ({priceStatus})</button>
                            <button onClick={() => setActiveTab('ledger')} className="bg-slate-900 hover:bg-slate-800 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow-md transition">＋ 新增紀錄</button>
                        </div>
                    </div>

                    <div className="flex gap-1 bg-slate-200/50 p-1 rounded-xl w-full md:w-80">
                        {['dashboard', 'ledger', 'dividend', 'drive'].map(t => (
                            <button key={t} onClick={() => setActiveTab(t)} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${activeTab === t ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>
                                {t==='dashboard'?'總覽':t==='ledger'?'記帳':t==='dividend'?'配息':'備份'}
                            </button>
                        ))}
                    </div>

                    {/* Tab 1: 總覽 */}
                    {activeTab === 'dashboard' && (
                        <div className="space-y-6">
                            <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
                                    <div className="text-[11px] font-bold text-slate-400 tracking-wider">總資產 (TWD)</div>
                                    <div className="text-xl md:text-2xl font-black text-slate-900 mt-2">${Number(stats.totalValue || 0).toLocaleString(undefined, {maximumFractionDigits:0})}</div>
                                </div>
                                <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
                                    <div className="text-[11px] font-bold text-slate-400 tracking-wider">總報酬率</div>
                                    <div className={`text-xl md:text-2xl font-black mt-2 ${stats.roi >= 0 ? 'text-rose-600' : 'text-emerald-600'}`}>{stats.roi >= 0 ? '+' : ''}{Number(stats.roi || 0).toFixed(2)}%</div>
                                </div>
                                <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
                                    <div className="text-[11px] font-bold text-slate-400 tracking-wider">累計配息 (TWD)</div>
                                    <div className="text-xl md:text-2xl font-black text-slate-900 mt-2">${Number(stats.divIncome || 0).toLocaleString(undefined, {maximumFractionDigits:0})}</div>
                                </div>
                            </div>

                            <div className="bg-white border border-slate-100 rounded-2xl p-6 shadow-sm space-y-4">
                                <h3 className="font-extrabold text-slate-800 text-sm tracking-tight">資產庫存明細 (外幣以原幣計)</h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs md:text-sm border-collapse">
                                        <thead>
                                            <tr className="border-b border-slate-200 text-slate-500 font-bold bg-slate-50 text-[11px]">
                                                <th className="p-3">標的</th>
                                                <th className="p-3">名稱</th>
                                                <th className="p-3">持股</th>
                                                <th className="p-3">均買成本</th>
                                                <th className="p-3">最新現價</th>
                                                <th className="p-3">投入成本</th>
                                                <th className="p-3">當前市值</th>
                                                <th className="p-3">總損益</th>
                                                <th className="p-3 text-center">報酬率 (%)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 font-medium">
                                            {portfolio.length === 0 ? (
                                                <tr><td colSpan="9" className="p-6 text-center text-slate-400 font-bold">尚無資產庫存資料</td></tr>
                                            ) : (
                                                portfolio.map(p => (
                                                    <tr key={p.symbol} className="hover:bg-slate-50 transition">
                                                        <td className="p-3 font-bold font-mono text-slate-900">{p.symbol}</td>
                                                        <td className="p-3 text-slate-600">{p.name || p.symbol}</td>
                                                        <td className="p-3 font-mono text-slate-800">{Number(p.currentShares || 0).toLocaleString(undefined, {maximumFractionDigits: 5})}</td>
                                                        <td className="p-3 font-mono text-slate-600">${Number(p.avgBuyCost || 0).toFixed(2)}</td>
                                                        <td className="p-3 font-mono text-blue-600 font-bold">${Number(p.currentPrice || 0).toFixed(2)}</td>
                                                        <td className="p-3 font-mono text-slate-700">${Number(p.currentInvestCost || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                        <td className="p-3 font-mono text-slate-900 font-semibold">${Number(p.currentMarketValue || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                                                        <td className={`p-3 font-mono font-bold ${Number(p.totalProfit || 0) >= 0 ? 'text-rose-600' : 'text-emerald-600'}`}>
                                                            {Number(p.totalProfit || 0) >= 0 ? '+' : ''}{Number(p.totalProfit || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                                                        </td>
                                                        <td className="p-3 text-center">
                                                            <span className={`px-2 py-0.5 rounded font-bold ${Number(p.totalProfit || 0) >= 0 ? 'text-rose-600 bg-rose-50' : 'text-emerald-600 bg-emerald-50'}`}>
                                                                {Number(p.totalProfit || 0) >= 0 ? '+' : ''}{Number(p.roi || 0).toFixed(2)}%
                                                            </span>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Tab 2: 記帳 */}
                    {activeTab === 'ledger' && (
                        <div className="bg-white border border-slate-100 rounded-2xl p-6 shadow-sm space-y-6">
                            <form onSubmit={(e)=>{
                                e.preventDefault(); 
                                if(!txForm.symbol||!txForm.price||!txForm.shares) return; 
                                const isUs = isNaN(txForm.symbol) && !txForm.symbol.endsWith('A'); 
                                setTransactions([{...txForm, id:Date.now().toString(), market: isUs ? 'US' : 'TW', name: STOCK_NAMES[txForm.symbol.toUpperCase().trim()] || txForm.symbol}, ...transactions]); 
                                setTxForm({date: new Date().toISOString().split('T')[0], symbol:'', type:'BUY', price:'', shares:'', fee:'20', tax:'0', txRate:'1'});
                            }} className="grid grid-cols-1 sm:grid-cols-4 gap-4 items-end bg-slate-50 p-5 rounded-2xl border border-slate-100">
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">交易日期</label><input type="date" value={txForm.date} onChange={handleFormInput} name="date" className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs" /></div>
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">標的代號 (自動切換台美股)</label><input type="text" placeholder="如 2330 / QQQ / 5289" value={txForm.symbol} onChange={handleFormInput} name="symbol" className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs uppercase font-mono font-bold" /></div>
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">交易種類</label><select value={txForm.type} onChange={handleFormInput} name="type" className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs font-bold"><option value="BUY">買入</option><option value="SELL">賣出</option></select></div>
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">成交單價 / 股數</label><div className="flex gap-1"><input type="number" step="any" placeholder="單價" value={txForm.price} onChange={handleFormInput} name="price" className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs" /><input type="number" step="any" placeholder="股數" value={txForm.shares} onChange={handleFormInput} name="shares" className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs" /></div></div>
                                
                                <div className="sm:col-span-3 grid grid-cols-1 sm:grid-cols-3 gap-3 bg-white/80 p-3 rounded-xl border border-slate-200/60 text-xs text-slate-500">
                                    <div>手續費試算：<span className="font-mono font-bold text-slate-800">${txForm.fee}</span></div>
                                    <div>證交稅/規費：<span className="font-mono font-bold text-rose-500">${txForm.tax}</span></div>
                                    <div><label className="block text-[10px] text-slate-400 font-bold mb-0.5">扣款匯率 (台股為 1)</label><input type="number" step="any" value={txForm.txRate} onChange={handleFormInput} name="txRate" disabled={!(isNaN(txForm.symbol)&&!txForm.symbol.endsWith('A'))} className="w-full bg-slate-50 border border-slate-200 px-2 py-0.5 rounded text-slate-800 font-mono font-bold text-center disabled:opacity-40" /></div>
                                </div>
                                <button type="submit" className="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl text-xs hover:bg-slate-800 shadow transition-all">儲存交易資產</button>
                            </form>
                            
                            <table className="w-full text-left text-sm">
                                <thead><tr className="text-slate-400 text-xs border-b"><th>日期</th><th>標的</th><th>市場</th><th>種類</th><th>單價</th><th>股數</th><th>扣款匯率</th><th>操作</th></tr></thead>
                                <tbody>
                                    {transactions.map(t=>(
                                        <tr key={t.id} className="border-b">
                                            <td className="py-3 text-xs text-slate-400 font-mono">{t.date}</td>
                                            <td className="py-3 font-bold">{t.symbol}</td>
                                            <td className="text-xs">{t.market==='US'?'🇺🇸 美股':'🇹🇼 台股'}</td>
                                            <td><span className={`px-2 py-0.5 rounded text-[10px] font-bold ${t.type==='BUY'?'bg-rose-50 text-rose-600':'bg-emerald-50 text-emerald-600'}`}>{t.type==='BUY'?'買入':'賣出'}</span></td>
                                            <td className="py-3 font-mono">${t.price}</td>
                                            <td className="py-3 font-mono">{t.shares}</td>
                                            <td className="py-3 font-mono text-slate-500">{t.market==='TW'?'1.00':t.txRate}</td>
                                            <td><button onClick={()=>setTransactions(transactions.filter(x=>x.id!==t.id))} className="text-slate-300 hover:text-rose-500">🗑️</button></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {/* Tab 3: 配息 */}
                    {activeTab === 'dividend' && (
                        <div className="bg-white border border-slate-100 rounded-2xl p-6 shadow-sm space-y-6">
                            <form onSubmit={(e)=>{
                                e.preventDefault(); 
                                if(!divForm.symbol||!divForm.netAmount) return; 
                                const isUs = isNaN(divForm.symbol) && !divForm.symbol.endsWith('A');
                                setDividends([{...divForm, id:Date.now().toString(), market: isUs ? 'US' : 'TW', name:STOCK_NAMES[divForm.symbol.toUpperCase().trim()]||divForm.symbol}, ...dividends]); 
                                setDivForm({date:new Date().toISOString().split('T')[0], market: 'TW', symbol:'', netAmount:''});
                            }} className="grid grid-cols-1 sm:grid-cols-4 gap-3 items-end bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">配息日期</label><input type="date" value={divForm.date} onChange={e=>setDivForm({...divForm, date:e.target.value})} className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs" /></div>
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">代號</label><input type="text" placeholder="0056" value={divForm.symbol} onChange={e=>setDivForm({...divForm, symbol:e.target.value.toUpperCase().trim()})} className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs uppercase font-mono" /></div>
                                <div><label className="text-[11px] font-bold text-slate-500 block mb-1">實收金額</label><input type="number" step="any" placeholder="金額" value={divForm.netAmount} onChange={e=>setDivForm({...divForm, netAmount:e.target.value})} className="w-full bg-white border border-slate-200 p-2 rounded-lg text-xs font-mono" /></div>
                                <button type="submit" className="w-full bg-slate-900 text-white font-bold py-2 rounded-lg text-xs hover:bg-slate-800">存入配息本</button>
                            </form>
                            <table className="w-full text-left text-sm">
                                <thead><tr className="text-slate-400 text-xs border-b"><th>日期</th><th>標的</th><th>實收金額</th><th>操作</th></tr></thead>
                                <tbody>
                                    {dividends.map(d=>(
                                        <tr key={d.id} className="border-b">
                                            <td className="py-2 text-xs font-mono">{d.date}</td>
                                            <td className="py-2 font-bold">{d.symbol}</td>
                                            <td className="py-2 font-mono text-emerald-600">${d.netAmount}</td>
                                            <td><button onClick={()=>setDividends(dividends.filter(x=>x.id!==d.id))} className="text-slate-300 hover:text-rose-500">🗑️</button></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {/* Tab 4: 備份 */}
                    {activeTab === 'drive' && (
                        <div className="max-w-md mx-auto bg-white border border-slate-100 rounded-2xl p-6 shadow-sm space-y-4">
                            <h3 className="font-extrabold text-slate-800 text-sm">JSON 備份與匯出</h3>
                            <p className="text-xs text-slate-500">可將目前瀏覽器儲存的交易與配息資料匯出為檔案留存。</p>
                            <button onClick={()=>{
                                const blob = new Blob([JSON.stringify({transactions, dividends}, null, 2)], {type : 'application/json'});
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = url;
                                a.download = `glowwealth_backup_${new Date().toISOString().split('T')[0]}.json`;
                                a.click();
                            }} className="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl text-xs hover:bg-slate-800 shadow">💾 匯出備份檔案 (JSON)</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
