<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>GlowWealth - 彙總修復版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script>
        const e = React.createElement;

        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [txs, setTxs] = React.useState([]);

            React.useEffect(() => {
                const data = localStorage.getItem('gw_data');
                if (data) try { setTxs(JSON.parse(data)); } catch(e) { setTxs([]); }
            }, []);

            // 核心功能：資產合併計算
            const portfolio = React.useMemo(() => {
                const map = {};
                txs.forEach(t => {
                    if (!map[t.symbol]) map[t.symbol] = { symbol: t.symbol, shares: 0, cost: 0 };
                    map[t.symbol].shares += Number(t.shares || 0);
                    map[t.symbol].cost += (Number(t.price || 0) * Number(t.shares || 0));
                });
                return Object.values(map);
            }, [txs]);

            return e('div', { className: 'p-4 md:p-8 max-w-4xl mx-auto' },
                e('h1', { className: 'text-2xl font-bold mb-6' }, 'GlowWealth 總覽'),
                e('div', { className: 'flex gap-2 bg-gray-200 p-1 rounded-lg mb-6' },
                    ['dashboard', 'ledger'].map(t => e('button', { key: t, onClick: () => setActiveTab(t), className: `flex-1 py-2 rounded ${activeTab === t ? 'bg-white shadow' : ''}` }, t))
                ),
                activeTab === 'dashboard' ? e('div', { className: 'bg-white p-6 rounded-xl shadow-sm border' },
                    e('table', { className: 'w-full text-left' },
                        e('thead', null, e('tr', {className: 'border-b text-xs text-gray-400'}, e('th', {className: 'p-2'}, '代號'), e('th', {className: 'p-2'}, '總持股'), e('th', {className: 'p-2'}, '總成本'))),
                        e('tbody', null, portfolio.map(p => e('tr', {key: p.symbol, className: 'border-b'}, 
                            e('td', {className: 'p-2 font-bold'}, p.symbol),
                            e('td', {className: 'p-2'}, p.shares),
                            e('td', {className: 'p-2'}, '$' + p.cost.toFixed(2))
                        )))
                    )
                ) : e('div', { className: 'bg-white p-6 rounded-xl shadow-sm border' }, '記帳頁面恢復中...')
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>
</html>
