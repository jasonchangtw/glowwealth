<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>GlowWealth - 數據恢復版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script>
        const e = React.createElement;
        const STOCK_NAMES = {
          '0050': '元大台灣50', '00878': '國泰永續高股息', '00929': '復華台灣科技優息', '2330': '台積電',
          '00919': '群益台灣精選高息', '6438': '訊得機械', '2881': '富邦金控', '8462': '柏文', '009811': '統一美國50',
          '2890': '永豐金', 'QQQ': '納斯達克 100 ETF', 'VOO': '標普 500 ETF', 'VT': 'Vanguard 全球股票', 
          '1313': '聯成', '00981A': '統一台股增長', '00982A': '群益台灣強棒', '00403A': '統一升級50', 
          '5289': '宜鼎', '2317': '鴻海', '2454': '聯發科', 'TSLA': '特斯拉', 'NVDA': '輝達'
        };

        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [txs, setTxs] = React.useState([]);

            // 資料安全讀取與同步
            React.useEffect(() => {
                const data = localStorage.getItem('gw_v15_txs');
                if (data) {
                    try { setTxs(JSON.parse(data)); } catch(e) { console.error("資料損壞", e); }
                }
            }, []);

            const renderDashboard = () => {
                if (txs.length === 0) return e('div', {className: 'p-10 text-center text-gray-500'}, '目前沒有交易紀錄');
                
                return e('div', {className: 'bg-white p-6 rounded-xl shadow-sm border'},
                    e('table', {className: 'w-full text-left'},
                        e('thead', null, e('tr', {className: 'border-b text-xs text-gray-400'}, 
                            e('th', {className: 'p-2'}, '代號'), e('th', {className: 'p-2'}, '持股'), e('th', {className: 'p-2'}, '總成本'))),
                        e('tbody', null, txs.map(t => e('tr', {key: t.id, className: 'border-b'}, 
                            e('td', {className: 'p-2 font-bold'}, t.symbol),
                            e('td', {className: 'p-2'}, t.shares),
                            e('td', {className: 'p-2'}, '$' + (Number(t.price || 0) * Number(t.shares || 0)).toFixed(2))
                        )))
                    )
                );
            };

            const handleSave = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const newData = {
                    id: Date.now(),
                    symbol: formData.get('symbol').toUpperCase().trim(),
                    price: formData.get('price'),
                    shares: formData.get('shares'),
                    date: new Date().toLocaleDateString()
                };
                const updated = [newData, ...txs];
                setTxs(updated);
                localStorage.setItem('gw_v15_txs', JSON.stringify(updated));
                alert('交易已儲存！');
            };

            return e('div', { className: 'p-4 md:p-8 max-w-4xl mx-auto' },
                e('h1', { className: 'text-2xl font-bold mb-6' }, 'GlowWealth 總覽'),
                e('div', { className: 'flex gap-2 bg-gray-200 p-1 rounded-lg mb-6' },
                    ['dashboard', 'ledger'].map(t => e('button', { key: t, onClick: () => setActiveTab(t), className: `flex-1 py-2 rounded ${activeTab === t ? 'bg-white shadow' : ''}` }, t))
                ),
                activeTab === 'dashboard' ? renderDashboard() : e('div', {className: 'bg-white p-6 rounded-xl border'},
                    e('form', { onSubmit: handleSave, className: 'grid grid-cols-1 gap-4' },
                        e('input', { name: 'symbol', placeholder: '代號 (如 2330)', className: 'border p-2 rounded', required: true }),
                        e('input', { name: 'price', placeholder: '單價', className: 'border p-2 rounded', required: true }),
                        e('input', { name: 'shares', placeholder: '股數', className: 'border p-2 rounded', required: true }),
                        e('button', { type: 'submit', className: 'bg-black text-white p-2 rounded' }, '儲存')
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>
</html>
