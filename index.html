<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>GlowWealth - 數據恢復版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script>
        const e = React.createElement;

        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [txs, setTxs] = React.useState([]);

            // 數據恢復邏輯：強制從你原本存放的 key 讀取
            React.useEffect(() => {
                try {
                    const saved = localStorage.getItem('gw_v15_txs');
                    if (saved) {
                        setTxs(JSON.parse(saved));
                    }
                } catch (err) {
                    console.error("資料讀取失敗，可能是格式舊了", err);
                }
            }, []);

            return e('div', { className: 'p-4 md:p-8 max-w-4xl mx-auto' },
                e('h1', { className: 'text-2xl font-bold mb-6' }, 'GlowWealth 總覽'),
                e('div', { className: 'flex gap-2 bg-gray-200 p-1 rounded-lg mb-6' },
                    ['dashboard', 'ledger'].map(t => e('button', { key: t, onClick: () => setActiveTab(t), className: `flex-1 py-2 rounded ${activeTab === t ? 'bg-white shadow' : ''}` }, t))
                ),
                activeTab === 'dashboard' ? e('div', { className: 'bg-white p-6 rounded-xl shadow-sm border' },
                    e('table', { className: 'w-full text-left' },
                        e('thead', null, e('tr', {className: 'border-b text-xs text-gray-400'}, e('th', {className: 'p-2'}, '代號'), e('th', {className: 'p-2'}, '持股'), e('th', {className: 'p-2'}, '總成本'))),
                        e('tbody', null, txs.length === 0 ? 
                            e('tr', null, e('td', {colSpan: 3, className: 'p-4 text-center text-gray-500'}, '目前沒有交易紀錄')) : 
                            txs.map(t => e('tr', {key: t.id, className: 'border-b'}, 
                                e('td', {className: 'p-2 font-bold'}, t.symbol),
                                e('td', {className: 'p-2'}, t.shares),
                                e('td', {className: 'p-2'}, '$' + (Number(t.price || 0) * Number(t.shares || 0)).toFixed(2))
                            ))
                        )
                    )
                ) : e('div', { className: 'bg-white p-6 rounded-xl shadow-sm border' }, '記帳功能頁面 (恢復中...)')
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>
</html>
