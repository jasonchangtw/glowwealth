<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>GlowWealth - 完美穩定版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script>
        const e = React.createElement;
        const STOCK_NAMES = {
          '0050': '元大台灣50', '00878': '國泰永續高股息', '00929': '復華台灣科技優息', '2330': '台積電',
          '00919': '群益台灣精選高息', '6438': '訊得機械', '2881': '富邦金控', '8462': '柏文', '009811': '統一美國50',
          '2890': '永豐金', 'QQQ': '納斯達克 100 ETF', 'VOO': '標普 500 ETF', 'VT': 'Vanguard 全球股票', 
          '1313': '聯成', '00981A': '統一台股增長', '00982A': '群益台灣強棒', '00403A': '統一升級50', 
          '5289': '宜鼎', '2317': '鴻海', '2454': '聯發科', 'TSLA': '特斯拉', 'NVDA': '輝達'
        };

        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [txs, setTxs] = React.useState(() => JSON.parse(localStorage.getItem('gw_data') || '[]'));

            const handleSave = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const newData = {
                    id: Date.now(),
                    symbol: formData.get('symbol').toUpperCase(),
                    price: formData.get('price'),
                    shares: formData.get('shares'),
                    date: new Date().toLocaleDateString()
                };
                const updated = [newData, ...txs];
                setTxs(updated);
                localStorage.setItem('gw_data', JSON.stringify(updated));
                alert('儲存成功！');
            };

            return e('div', { className: 'p-4 md:p-8 max-w-4xl mx-auto' },
                e('h1', { className: 'text-2xl font-bold mb-6' }, 'GlowWealth 總覽'),
                e('div', { className: 'flex gap-2 mb-6' },
                    ['dashboard', 'ledger'].map(t => e('button', { key: t, onClick: () => setActiveTab(t), className: `px-4 py-2 rounded ${activeTab === t ? 'bg-white shadow border' : 'bg-gray-200'}` }, t))
                ),
                activeTab === 'dashboard' ? e('div', { className: 'bg-white p-6 rounded-xl shadow-sm border' },
                    e('table', { className: 'w-full text-left' },
                        e('thead', null, e('tr', {className: 'border-b'}, e('th', {className: 'p-2'}, '代號'), e('th', {className: 'p-2'}, '持股'), e('th', {className: 'p-2'}, '成本'))),
                        e('tbody', null, txs.map(t => e('tr', {key: t.id, className: 'border-b'}, 
                            e('td', {className: 'p-2'}, t.symbol),
                            e('td', {className: 'p-2'}, t.shares),
                            e('td', {className: 'p-2'}, '$' + (Number(t.price) * Number(t.shares)).toFixed(2))
                        )))
                    )
                ) : e('div', { className: 'bg-white p-6 rounded-xl shadow-sm border' },
                    e('form', { onSubmit: handleSave, className: 'grid grid-cols-1 gap-4' },
                        e('input', { name: 'symbol', placeholder: '代號 (如 2330)', className: 'border p-2 rounded', required: true }),
                        e('input', { name: 'price', placeholder: '單價', className: 'border p-2 rounded', required: true }),
                        e('input', { name: 'shares', placeholder: '股數', className: 'border p-2 rounded', required: true }),
                        e('button', { type: 'submit', className: 'bg-black text-white p-2 rounded' }, '儲存紀錄')
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>
</html>
